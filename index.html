<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fischer Specification Hub — Mohamed Bakr</title>
<style>
:root{
  --navy:#1E2F4D; --navy2:#152238; --navy3:#243B61;
  --red:#E2001A; --red-dark:#B80015;
  --bg:#EFF1F5; --card:#FFFFFF; --ink:#1A2233; --muted:#68758C;
  --line:#E2E6EE; --soft:#F6F8FB;
  --green:#2E9E5B; --teal:#2FA4A9; --amber:#E8A13A; --blue:#3B82C4; --orange:#E0702E; --grey:#98A2B3;
  --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  --shadow-lg:0 8px 24px rgba(16,24,40,.16);
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C6CDD9;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ============ APP FRAME ============ */
#app{display:flex;min-height:100vh}
#sidebar{width:216px;background:var(--navy2);color:#D6DEEB;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.brand{padding:18px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.btn.big{padding:9px 15px;font-size:13.5px;font-weight:800}
.logo-chip{background:#fff;border-radius:6px;padding:7px 11px;display:inline-block;line-height:0}
.brand .owner{font-size:12.5px;font-weight:800;color:#fff;letter-spacing:.02em;margin-top:2px}
.logo-chip img{height:20px;width:auto;display:block}
.brand .sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8FA0BC;margin-top:3px}
#nav{flex:1;padding:10px 8px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#B9C5D8;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;text-align:left;margin-bottom:2px;position:relative}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--navy3);color:#fff}
.nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--red);border-radius:2px}
.nav-item .cnt{margin-left:auto;background:rgba(255,255,255,.12);font-size:10.5px;padding:1px 7px;border-radius:9px;font-weight:700}
.side-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px;color:#7686A1}
.side-foot b{color:#AFC0DB}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30}
#page-title{font-size:17px;font-weight:800;letter-spacing:-.01em}
#page-sub{font-size:12px;color:var(--muted)}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
#content{padding:20px 22px 60px;flex:1}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:700;transition:all .12s}
.btn:hover{border-color:#B9C2D0;background:var(--soft)}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-dark)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.navy:hover{background:var(--navy3)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--soft);color:var(--ink)}
.btn.sm{padding:4px 9px;font-size:11.5px;border-radius:6px}
.btn.danger-line{color:#C11227;border-color:#F3C2C9}
.btn.danger-line:hover{background:#FDF1F2}
.icon-btn{border:0;background:none;color:var(--muted);padding:4px;border-radius:6px;display:inline-flex}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.icon-btn svg{width:15px;height:15px}

/* ============ CARDS / KPI ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .k-label{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kpi .k-val{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.kpi .k-note{font-size:11px;color:var(--muted);margin-top:2px}
.kpi.accent .k-val{color:var(--red)}
.section-h{display:flex;align-items:center;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.section-h h2{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.section-h .hint{font-size:11.5px;color:var(--muted)}
.section-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ============ FILTER BAR ============ */
.filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search-box{position:relative}
.search-box input{width:230px;padding:7px 10px 7px 30px;border:1px solid var(--line);border-radius:8px;background:#fff}
.search-box svg{position:absolute;left:9px;top:8px;width:14px;height:14px;color:var(--muted)}
.filter-bar select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:600;font-size:12.5px}
.chip-row{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;padding:5px 11px;border-radius:16px;font-size:12px;font-weight:700;color:var(--muted)}
.chip:hover{border-color:#B9C2D0;color:var(--ink)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.count-note{font-size:12px;color:var(--muted);margin-left:auto}

/* ============ TABLES ============ */
.tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:auto;max-width:100%}
/* Projects table: height-capped so the horizontal scrollbar always sits on screen,
   with the first three columns frozen so you never lose the project name */
.tbl-wrap.proj{max-height:66vh}
.tbl-wrap.proj table.tbl th:nth-child(1),.tbl-wrap.proj table.tbl td:nth-child(1){position:sticky;left:0;width:42px;min-width:42px}
.tbl-wrap.proj table.tbl th:nth-child(2),.tbl-wrap.proj table.tbl td:nth-child(2){position:sticky;left:42px;width:48px;min-width:48px}
.tbl-wrap.proj table.tbl th:nth-child(3),.tbl-wrap.proj table.tbl td:nth-child(3){position:sticky;left:90px;min-width:200px;box-shadow:3px 0 0 -1px var(--line)}
.tbl-wrap.proj table.tbl td:nth-child(-n+3){background:var(--card);z-index:1}
.tbl-wrap.proj table.tbl tr.row-cancel td:nth-child(-n+3){background:#FDF1F2}
.tbl-wrap.proj table.tbl th:nth-child(-n+3){z-index:4}
.tbl-wrap.editing{outline:2px solid var(--amber);outline-offset:-2px}
td.locked{color:var(--ink);cursor:default}
td.locked .lockval{display:block;padding:3px 6px;min-height:18px}
td.locked.num-cell .lockval{text-align:right}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
table.tbl th{background:var(--soft);color:#4A5670;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;white-space:nowrap}
table.tbl td{padding:8px 10px;border-bottom:1px solid #EEF1F6;vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:#FAFBFD}
table.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cell-main{font-weight:700}
.cell-sub{font-size:11px;color:var(--muted)}
.row-actions{white-space:nowrap;text-align:right}
a.mail{color:var(--blue);text-decoration:none}
a.mail:hover{text-decoration:underline}

/* ============ PILLS / STATUS ============ */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap;border:0}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.clickable{cursor:pointer}
.pill.clickable:hover{filter:brightness(.94)}
.p-green{background:#E5F5EC;color:#1D7A43}
.p-teal{background:#E3F4F5;color:#187F84}
.p-blue{background:#E7F0FA;color:#2563A8}
.p-amber{background:#FCF2DF;color:#A6690F}
.p-orange{background:#FCEBDE;color:#B0511A}
.p-grey{background:#EEF1F5;color:#5B6779}
.p-red{background:#FCE5E8;color:#B80015}
.p-navy{background:#E4E9F2;color:#1E2F4D}

/* BU status chips (team tracking 0-4) */
.bu-chip{display:inline-flex;align-items:center;gap:5px;border-radius:7px;padding:3px 8px;font-size:11px;font-weight:700;border:1px solid transparent;cursor:pointer}
.bu-chip .n{width:15px;height:15px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:9.5px;font-weight:800}
.st0{background:#F0F2F6;color:#5B6779}.st0 .n{background:#98A2B3}
.st1{background:#E7F0FA;color:#2563A8}.st1 .n{background:#3B82C4}
.st2{background:#FCF2DF;color:#A6690F}.st2 .n{background:#E8A13A}
.st3{background:#E3F4F5;color:#187F84}.st3 .n{background:#2FA4A9}
.st4{background:#E5F5EC;color:#1D7A43}.st4 .n{background:#2E9E5B}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);align-items:center}
.legend .bu-chip{cursor:default}

/* yes/no toggles */
.yn{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:800;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--muted)}
.yn.on{background:#E5F5EC;border-color:#BFE5CD;color:#1D7A43}

/* ============ VENDOR CARDS ============ */
.vendor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.vcard .v-top{display:flex;align-items:flex-start;gap:8px}
.vcard .v-name{font-weight:800;font-size:13.5px;line-height:1.25}
.vcard .v-meta{font-size:11px;color:var(--muted)}
.vcard .prio{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.prio.A{background:var(--red)}.prio.B{background:var(--navy)}.prio.C{background:var(--grey)}
.bu-toggle-row{display:flex;gap:5px;flex-wrap:wrap}
.bu-tog{border:1px solid var(--line);background:var(--soft);border-radius:7px;padding:4px 8px;font-size:10.5px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:52px}
.bu-tog.on{background:#E5F5EC;border-color:#BFE5CD;color:#1D7A43}
.bu-tog .d{font-size:9px;font-weight:600;opacity:.8}
.v-contact{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.v-foot{display:flex;align-items:center;gap:8px;margin-top:auto}

/* ============ TASK BOARD ============ */
.task-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tcol{background:#E9EDF3;border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.tcol h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:#4A5670;font-weight:800;display:flex;align-items:center;gap:7px;padding:2px 4px}
.tcol h3 .cnt{background:#fff;border-radius:9px;padding:0 7px;font-size:11px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.tcard .t-name{font-weight:700;font-size:12.5px;line-height:1.3}
.tcard .t-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:10.5px;color:var(--muted)}
.tcard .t-foot{display:flex;gap:6px;align-items:center}
.tcard.done .t-name{text-decoration:line-through;color:var(--muted)}
.due-late{color:#C11227;font-weight:700}
.bucket-tag{background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:10px;font-weight:700;color:#5B6779}
.t-status-btn{width:17px;height:17px;border-radius:50%;border:2px solid #C6CDD9;background:#fff;cursor:pointer;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;padding:0}
.t-status-btn.prog{border-color:var(--blue);background:#E7F0FA}
.t-status-btn.done{border-color:var(--green);background:var(--green);color:#fff}
.t-status-btn svg{width:10px;height:10px}

/* ============ SLIDES ============ */
.slide-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.slides-stack{display:flex;flex-direction:column;gap:26px;max-width:1060px}
.slide-block h4{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.slide-block h4 .auto{font-size:10px;background:#E3F4F5;color:#187F84;padding:1px 7px;border-radius:8px}
.slide-block h4 .man{font-size:10px;background:#FCF2DF;color:#A6690F;padding:1px 7px;border-radius:8px}
.slide{aspect-ratio:16/9;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow-lg);overflow:hidden;position:relative;display:flex;flex-direction:column;container-type:inline-size}
.s-head{background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 4.2cqw;height:13.5cqh;flex-shrink:0;position:relative}
.s-head .s-title{font-size:3.1cqw;font-weight:800;letter-spacing:.01em;text-transform:uppercase}
.s-head img.s-logo{position:absolute;right:3.4cqw;top:50%;transform:translateY(-50%);height:5.2cqh}
.s-head::after{content:"";position:absolute;left:0;right:0;bottom:-0.7cqh;height:0.7cqh;background:var(--red)}
.s-body{flex:1;padding:3.4cqh 4.2cqw;overflow:hidden;display:flex;flex-direction:column}
.s-foot{position:absolute;bottom:1.6cqh;left:4.2cqw;right:4.2cqw;display:flex;justify-content:space-between;font-size:1.35cqw;color:#8A94A8}
table.s-tbl{width:100%;border-collapse:collapse;font-size:1.75cqw}
table.s-tbl th{background:var(--navy);color:#fff;padding:1.1cqh 1cqw;font-weight:700;text-align:center;border:1px solid #fff;font-size:1.65cqw}
table.s-tbl td{border:1px solid #D8DEE8;padding:0.9cqh 1cqw;text-align:center;background:#fff}
table.s-tbl td.l{text-align:left}
table.s-tbl tr.alt td{background:#F3F6FA}
table.s-tbl tr.total td{background:var(--navy);color:#fff;font-weight:800}
table.s-tbl .check{color:var(--green);font-weight:800;font-size:2cqw}
table.s-tbl td[contenteditable],th[contenteditable]{outline:none}
td[contenteditable]:focus,th[contenteditable]:focus,[contenteditable].ed:focus{background:#FFF8E1!important;box-shadow:inset 0 0 0 2px var(--amber)}
.s-chart{flex:1;display:flex;align-items:flex-end;gap:4.5cqw;padding:2cqh 3cqw 4.5cqh}
.s-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:1cqh;height:100%;justify-content:flex-end}
.s-bar{width:70%;background:var(--navy);border-radius:4px 4px 0 0;position:relative;min-height:2cqh}
.s-bar.r{background:var(--red)}
.s-bar .v{position:absolute;top:-3.4cqh;left:0;right:0;text-align:center;font-weight:800;font-size:2.2cqw}
.s-bar-lab{font-size:1.6cqw;font-weight:700;color:#4A5670;text-align:center}
.s-title-slide{background:var(--navy);color:#fff;align-items:flex-start;justify-content:center;padding:0 6cqw;display:flex;flex-direction:column;gap:2.4cqh}
.s-title-slide .big{font-size:5.2cqw;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.s-title-slide .red-line{width:12cqw;height:1.1cqh;background:var(--red)}
.s-title-slide .who{font-size:2.2cqw;color:#B9C5D8}
.s-two-col{display:grid;grid-template-columns:1fr 1fr;gap:3cqw;flex:1;align-items:start}
.s-panel{background:#F3F6FA;border-radius:8px;padding:2.4cqh 2cqw;height:100%}
.s-panel h5{color:var(--red);font-size:2.2cqw;font-weight:800;margin-bottom:1.4cqh}
.s-panel div,.s-panel ul{font-size:1.85cqw;line-height:1.55}
.slide-edit-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.mini-note{font-size:11px;color:var(--muted)}
.ov-input{width:74px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;text-align:center}

/* ============ MODAL ============ */
#modal-back{position:fixed;inset:0;background:rgba(13,20,33,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow-y:auto}
#modal-back.open{display:flex}
#modal{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:640px;overflow:hidden;animation:pop .14s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
#modal .m-head{display:flex;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line)}
#modal .m-head h3{font-size:15px;font-weight:800}
#modal .m-body{padding:16px 20px;max-height:64vh;overflow-y:auto}
#modal .m-foot{display:flex;gap:8px;justify-content:flex-end;padding:13px 20px;border-top:1px solid var(--line);background:var(--soft)}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px}
.f-field{display:flex;flex-direction:column;gap:4px}
.f-field.full{grid-column:1/-1}
.f-field label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.f-field input,.f-field select,.f-field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.f-field textarea{min-height:64px;resize:vertical}
.f-field input:focus,.f-field select:focus,.f-field textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(30,47,77,.12)}
.m-sub{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--red);margin:16px 0 8px;padding-top:12px;border-top:1px dashed var(--line)}
.m-sub:first-child{margin-top:0;border:0;padding-top:0}

/* password mask */
.pw-cell{display:inline-flex;align-items:center;gap:5px;font-family:ui-monospace,Consolas,monospace;font-size:11.5px}

/* toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy2);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);z-index:200;transition:transform .25s;display:flex;gap:9px;align-items:center;max-width:92vw}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{background:#B80015}

/* save state indicator */
#save-dot{width:8px;height:8px;border-radius:50%;background:var(--green);transition:background .2s}
#save-dot.saving{background:var(--amber)}
#save-dot.off{background:var(--grey)}
.save-wrap{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}

/* misc */
.empty{padding:34px;text-align:center;color:var(--muted);font-size:13px}
.tag-lead{background:#FCE5E8;color:#B80015;font-size:10px;font-weight:800;padding:1px 7px;border-radius:8px}
.inline-flag{width:15px;height:15px;accent-color:var(--red);cursor:pointer}
[dir=auto]{unicode-bidi:plaintext}
.money{font-variant-numeric:tabular-nums;font-weight:700}


/* ============ BU STATUS COLORS ============ */
.bu-s0{background:#F0F2F6;border-color:var(--line);color:#5B6779}
.bu-s1{background:#FCF2DF;border-color:#F0DCB0;color:#A6690F}
.bu-s2{background:#FCEBDE;border-color:#F2CFB4;color:#B0511A}
.bu-s3{background:#E7F0FA;border-color:#C3D9F0;color:#2563A8}
.bu-s4{background:#E5F5EC;border-color:#BFE5CD;color:#1D7A43}
.bu-s5{background:#E3F4F5;border-color:#BCE2E4;color:#187F84}

/* select styled as pill */
.sel-pill{border:1px solid var(--line);border-radius:12px;padding:3px 8px;font-size:11px;font-weight:700;background:#fff;cursor:pointer;max-width:100%}
.sel-pill.p-green{background:#E5F5EC;color:#1D7A43;border-color:#BFE5CD}
.sel-pill.p-navy{background:#E4E9F2;color:#1E2F4D;border-color:#C6D2E4}
.sel-pill.p-blue{background:#E7F0FA;color:#2563A8;border-color:#C3D9F0}
.sel-pill.p-amber{background:#FCF2DF;color:#A6690F;border-color:#F0DCB0}
.sel-pill.p-orange{background:#FCEBDE;color:#B0511A;border-color:#F2CFB4}
.sel-pill.p-grey{background:#EEF1F5;color:#5B6779}
.sel-pill.p-red{background:#FCE5E8;color:#B80015}

/* ============ POPOVER ============ */
#popover{position:fixed;z-index:120;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow-lg);padding:13px 14px;width:250px;display:none}
#popover h5{font-size:12px;font-weight:800;margin-bottom:9px;display:flex;align-items:center;gap:7px}
#popover .f-field{margin-bottom:9px}
#popover .pop-foot{display:flex;gap:7px;justify-content:flex-end;margin-top:4px}

/* ============ INLINE EDIT CELLS (projects) ============ */
td.ed-cell{cursor:text;position:relative}
td.ed-cell:hover{background:#FDFAF0;box-shadow:inset 0 -2px 0 #E8D9A0}
td.ed-cell:focus{outline:none;background:#FFF8E1;box-shadow:inset 0 0 0 2px var(--amber)}
select.cell-sel{border:1px solid transparent;background:transparent;font-size:11.5px;font-weight:600;max-width:130px;padding:3px 2px;border-radius:6px;cursor:pointer}
select.cell-sel:hover{border-color:var(--line);background:#fff}

/* ============ PLANNER BOARD ============ */
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:16px}
.board .tcol{min-width:256px;width:256px;flex-shrink:0}
.tcard[draggable=true]{cursor:grab}
.tcard.dragging{opacity:.45}
.tcol.dragover{outline:2px dashed var(--red);outline-offset:-2px;background:#F3E8E9}
.tcol h3 .bcnt{margin-left:auto;background:#fff;border-radius:9px;padding:0 7px;font-size:11px}

.tcol.bucket-target{outline:2px dashed var(--red);outline-offset:-2px}
.tcol h3[draggable]{cursor:grab}
.tcol h3[draggable]:active{cursor:grabbing}
.board.stacked{display:block;overflow-x:visible}
.board.stacked .tcol{width:auto;max-width:820px;margin:0 0 14px;flex:none}
.tcard{position:relative}
.tcard.drop-above::before,.tcard.drop-below::after{
  content:'';position:absolute;left:-2px;right:-2px;height:4px;border-radius:3px;
  background:var(--red);box-shadow:0 0 0 2px rgba(226,0,26,.18)}
.tcard.drop-above::before{top:-5px}
.tcard.drop-below::after{bottom:-5px}
.tcard.dragging{opacity:.45;transform:scale(.98)}
.note-card{display:flex;align-items:flex-start;gap:7px;border:1px solid var(--line);border-radius:7px;
  padding:4px 6px;margin-bottom:4px;background:#FCFDFF}
.note-stamp{flex:0 0 auto;font-size:10px;font-weight:700;color:var(--navy);background:var(--soft);
  border-radius:5px;padding:3px 6px;white-space:nowrap;line-height:1.25;margin-top:1px}
.note-txt{flex:1;min-width:0;border:0;background:transparent;resize:none;overflow:hidden;
  font:inherit;font-size:12px;line-height:1.45;padding:2px 0;outline:none}
.note-del{flex:0 0 auto;opacity:.45}
.note-card:hover .note-del{opacity:1}
.cm-list{max-height:300px;overflow:auto;padding-right:2px}
@media(max-width:640px){.note-card{flex-wrap:wrap}.note-txt{flex:1 0 100%;order:3}}
.t-comm{font-size:11px;color:var(--muted);margin-top:5px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;border-top:1px dashed #E7EBF2;padding-top:4px}
/* canceled project rows */
tr.row-cancel td{background:#FDF1F2!important;color:#9AA3B2}
tr.row-new td{background:#FDECEE!important;box-shadow:inset 0 -1px 0 #F6C7CD}
tr.row-new td:first-child{box-shadow:inset 3px 0 0 var(--red), inset 0 -1px 0 #F6C7CD}
tr.row-up td{background:#FDECEE!important}
tr.row-up td:first-child{box-shadow:inset 3px 0 0 var(--red)}
tr.row-done td{background:#EFF9F2!important}
tr.row-done td:first-child{box-shadow:inset 3px 0 0 var(--green)}
tr.row-cancel td .cell-main{color:#B04A56;text-decoration:line-through}
/* reg documents */
.doc-sec{margin-bottom:18px}
.doc-sec h3{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--red);margin-bottom:8px}
.doc-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:7px;box-shadow:var(--shadow)}
.doc-row .d-field{width:250px;flex-shrink:0;font-size:12px;font-weight:700}
.doc-row .d-val{flex:1;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;word-break:break-all;cursor:pointer;padding:3px 6px;border-radius:6px}
.doc-row .d-val:hover{background:#FFF8E1}
@media(max-width:920px){.doc-row{flex-wrap:wrap}.doc-row .d-field{width:100%}}
@media(max-width:920px){
  #app{flex-direction:column}
  #sidebar{width:100%;height:auto;position:sticky;top:0;flex-direction:row;align-items:center;overflow-x:auto}
  .brand{border-bottom:0;padding:10px 12px;flex-shrink:0}
  .brand .sub{display:none}
  #nav{display:flex;padding:6px;gap:2px}
  .nav-item{white-space:nowrap;padding:8px 10px}
  .nav-item .cnt{display:none}
  .side-foot{display:none}
  #topbar{padding:10px 14px;flex-wrap:wrap}
  #content{padding:14px 12px 60px}
  .search-box input{width:150px}
  .f-grid{grid-template-columns:1fr}
}
@media print{#sidebar,#topbar{display:none}}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div>
        <div class="logo-chip"><img id="brand-logo" alt="fischer"></div>
        <div class="sub">Specification Hub</div>
        <div class="owner" id="brand-owner">Mohamed Bakr</div>
        <div class="sub" id="brand-build" style="opacity:.65;font-size:10.5px"></div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">Sr. Spec. Engineer<br><b>Mohamed Bakr</b> — KSA</div>
  </aside>
  <div id="main">
    <div id="topbar">
      <div>
        <div id="page-title">Dashboard</div>
        <div id="page-sub"></div>
      </div>
      <div class="top-actions">
        <span class="save-wrap"><span id="save-dot"></span><span id="save-txt">Saved</span></span>
        <button class="btn big navy" id="sync-btn" onclick="openSync()" title="Sync your data across devices" style="position:relative">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" style="width:15px;height:15px"><path d="M4 12a8 8 0 0114-5.3L20 8M20 12a8 8 0 01-14 5.3L4 16M20 4v4h-4M4 20v-4h4"/></svg>
          <span style="margin-left:5px">Sync</span>
          <span id="sync-dot" style="display:none;position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--amber)"></span>
        </button>
        <button class="btn big primary" onclick="saveNow()" title="Write every change to this device now">💾 Save</button>
        <button class="btn big" onclick="downloadBackupFile()" title="Download one file holding everything">⬇ Backup</button>
        <button class="btn" id="bell-btn" onclick="openReminders(true)" title="Tasks due within 2 days" style="position:relative">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M18 9a6 6 0 10-12 0c0 6-2.5 7-2.5 7h17S18 15 18 9zM10.5 20a2 2 0 003 0"/></svg>
          <span id="bell-cnt" style="display:none;position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:9px;font-size:10px;font-weight:800;padding:1px 6px;min-width:17px"></span>
        </button>
        <button class="btn" onclick="document.getElementById('imp-file').click()" title="Import data from Excel (hub export, MS Planner export, or the shared team Tracking file)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21V9m0 0l-4 4m4-4l4 4M4 5V4a1 1 0 011-1h14a1 1 0 011 1v1"/></svg>
          Import Excel</button>
        <input type="file" id="imp-file" accept=".xlsx,.xls" style="display:none" onchange="importExcelFile(this.files[0]);this.value=''">
        <button class="btn" onclick="exportAllExcel()" title="Download everything as one Excel workbook">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
          Export Excel</button>
        <button class="btn navy" onclick="go('slides')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v4m-4 0h8"/></svg>
          Slides</button>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div id="modal-back"><div id="modal">
  <div class="m-head"><h3 id="m-title">Edit</h3><button class="icon-btn" style="margin-left:auto" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="m-body" id="m-body"></div>
  <div class="m-foot" id="m-foot"></div>
</div></div>
<div id="toast"></div>
<div id="popover"></div>
<input type="file" id="bk-file" accept=".json,application/json" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">

/* Data is written to TWO places: the storage that belongs to this file, and the
   browser's own localStorage which is shared by every copy of the hub on this
   browser. If you open a newer copy of the hub, the first is empty but the second
   still holds your work, so nothing is left behind any more. */
const LSK='spechub3:';
function lsGet(k){ try{ const v=localStorage.getItem(LSK+k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(k,val){ try{ localStorage.setItem(LSK+k, JSON.stringify(val)); localStorage.setItem(LSK+'__stamp', String(Date.now())); }catch(e){} }
let usedFallback=false;
async function sget(k){
  let v=null;
  if(window.storage){
    try{ const r=await window.storage.get(LSK+k); v = r && r.value ? JSON.parse(r.value) : null; }catch(e){ v=null; }
  }
  if(v===null){
    const alt=lsGet(k);
    if(alt!==null){ usedFallback=true; return alt; }
  }
  return v;
}
async function sset(k){
  lsSet(k, S[k]);
  if(!window.storage){ storageOK=false; return; }
  try{ await window.storage.set(LSK+k, JSON.stringify(S[k])); }
  catch(e){ storageOK=false; setSaveDot('off','Session only'); }
}

/* ---- SBU record shape: [stage, vendorListDate, inDrawingsDate] ----
   Vendor list and In the drawings are independent milestones, each with its own date.
   An SBU is a registration once either date is set, and is counted ONCE. */
function sbuVL(b){ return (b && b[1]) || ''; }
function sbuDR(b){ return (b && b[2]) || ''; }
function sbuCounted(b, yf){
  const vl=sbuVL(b), dr=sbuDR(b);
  if(yf) return (vl && String(vl).startsWith(yf)) || (dr && String(dr).startsWith(yf));
  return !!(vl || dr);
}
function sbuStage(b){ return (b && b[0]) || 'Not Started'; }
/* class buckets, exactly as the KPI slide: Authorities and Developer win over A/B/C */
function classOf(type, prio){
  const t=String(type||'').toLowerCase();
  if(t.startsWith('auth')) return 'Auth';
  if(t.startsWith('dev')) return 'Dev';
  const p=String(prio||'C').toUpperCase();
  return ['A','B','C'].includes(p) ? p : 'C';
}
function emptyClasses(){ return {A:0,B:0,C:0,Auth:0,Dev:0}; }
function sbuLines(yf){
  const out=[];
  S.vendors.forEach(v=>BU_KEYS.forEach(k=>{
    const b=v[VF.BUS] && v[VF.BUS][k];
    if(!sbuCounted(b, yf)) return;
    out.push({co:v[VF.COMPANY], sbu:BU_LABELS[k].replace('Hanger & Support','H&S'), key:k,
              vl:sbuVL(b), dr:sbuDR(b), cls:classOf(v[VF.TYPE], v[VF.PRIO]),
              date:sbuVL(b)||sbuDR(b)});
  }));
  return out.sort((a,b)=> a.date<b.date?1:-1);
}
function buCountsSplit(yf){
  const c={}; BU_KEYS.forEach(k=>c[k]={list:0,draw:0});
  S.vendors.forEach(v=>BU_KEYS.forEach(k=>{
    const b=v[VF.BUS] && v[VF.BUS][k];
    if(!sbuCounted(b, yf)) return;
    const vl=sbuVL(b), dr=sbuDR(b);
    const vlIn = vl && (!yf || String(vl).startsWith(yf));
    if(vlIn) c[k].list++; else c[k].draw++;      /* counted once: vendor list wins */
  }));
  return c;
}
function onlineRegistered(yf){
  return S.onlinereg.filter(r=>{
    if(String(r[RF.STATUS]).toLowerCase()!=='vendor registered') return false;
    if(!yf) return true;
    return r[RF.DATE] && String(r[RF.DATE]).startsWith(yf);
  });
}
function onlineUndated(){
  return S.onlinereg.filter(r=>String(r[RF.STATUS]).toLowerCase()==='vendor registered' && !r[RF.DATE]);
}
/* MAIN KPI: SBU registrations + online portals, each item in exactly one class */
function mainKpi(yf){
  const byClass=emptyClasses();
  const lines=sbuLines(yf);
  lines.forEach(l=>byClass[l.cls]++);
  const portals=onlineRegistered(yf);
  portals.forEach(r=>byClass[classOf(r[RF.TYPE], r[RF.PRIO])]++);
  const vlCount=lines.filter(l=>l.vl && (!yf || String(l.vl).startsWith(yf))).length;
  return {byClass, sbu:lines.length, portals:portals.length,
          total:lines.length+portals.length, vl:vlCount, drOnly:lines.length-vlCount};
}
/* secondary statistic: distinct companies with at least one registered SBU */
function vendorCompanyState(v, yf){
  const anyVL=BU_KEYS.some(k=>{const b=v[VF.BUS]&&v[VF.BUS][k]; const vl=sbuVL(b); return vl && (!yf||String(vl).startsWith(yf));});
  if(anyVL) return 'list';
  const anyDR=BU_KEYS.some(k=>{const b=v[VF.BUS]&&v[VF.BUS][k]; const dr=sbuDR(b); return dr && (!yf||String(dr).startsWith(yf));});
  if(anyDR) return 'draw';
  return '';
}
function registeredVendors(yf){ return S.vendors.filter(v=>vendorCompanyState(v, yf)); }
function vendorSbuTags(v, which, yf){
  return BU_KEYS.filter(k=>{
    const b=v[VF.BUS]&&v[VF.BUS][k];
    const dt = which==='vl' ? sbuVL(b) : sbuDR(b);
    return dt && (!yf || String(dt).startsWith(yf));
  }).map(k=>BU_LABELS[k].replace('Hanger & Support','H&S'));
}

function fixYearOf(c){
  const d=String(c[CF.FIXDATE]||'').slice(0,4);

}

/* give every undated installation a sensible date so the year figures stop drifting.
   Rule: use the seminar date when it falls in the same year, otherwise mid-year of the
   contact's year sheet. Each one is tagged "assumed" until you adjust it. */
function assumedFixDate(c){
  const ys=String(c[CF.YEAR]||'').match(/(\d{4})(?!.*\d{4})/);
  const y = ys ? ys[1] : curYear();
  const sem=String(c[CF.SEMDATE]||'').slice(0,10);
  if(isDateStr(sem) && sem.slice(0,4)===y) return sem;
  return y+'-06-30';
}
function fillAssumedFixDates(){
  let n=0;
  S.meta.fixAssumed = S.meta.fixAssumed || [];
  S.contacts.forEach(c=>{
    if((+c[CF.NFIX]||0)<=0) return;
    if(String(c[CF.FIXDATE]||'').trim()) return;
    c[CF.FIXDATE]=assumedFixDate(c);
    if(!S.meta.fixAssumed.includes(c[CF.ID])) S.meta.fixAssumed.push(c[CF.ID]);
    n++;
  });
  if(n){ save('contacts'); save('meta'); logChange(n+' FiXperience install date(s) assumed from the year, adjust as needed', 'Contacts'); }
  return n;
}

function kpiActual(key, y){
  const K=mainKpi(y);
  const live=S.projects.filter(p=>p[PF.STATUS]!=='Canceled' && String(p[PF.YEAR])===y);
  switch(key){
    case 'turnover': return +((kpiTargets()['turnover']||{}).val)||0;   /* country turnover, entered by you */
    case 'vlA': return K.byClass.A + K.byClass.Auth + K.byClass.Dev + onlineRegistered(y).length;
    case 'vlB': return K.byClass.B;
    case 'vlC': return K.byClass.C;
    case 'vlOther': return K.byClass.Auth + K.byClass.Dev;
    case 'focus': return live.filter(poReleased).length;
    case 'fix': return kpiFix(y);
    case 'sem': return kpiSeminars(y);
    case 'sbu': return new Set(S.seminars.filter(s=>String(s[SF.DATE]).startsWith(y) && String(s[SF.SBU]||'').trim()).map(s=>s[SF.SBU])).size;
    case 'addl': {
      const T2=kpiTargets().addl, thr=+T2.thr||0, cap=+T2.t||0;
      const n=live.filter(p=>poReleased(p) && (+p[PF.EXP]||0)>=thr).length;
      return cap? Math.min(cap, n) : n;
    }
    default: return +((kpiTargets()[key]||{}).val)||0;
  }
}
/* the records behind each incentive figure, so a row can be opened and checked */
function kpiEvidence(key, y){
  const K=mainKpi(y);
  const live=S.projects.filter(p=>p[PF.STATUS]!=='Canceled' && String(p[PF.YEAR])===y);
  const sbuOf=cls=>sbuLines(y).filter(l=>l.cls===cls)
        .map(l=>({n:l.co+' — '+l.sbu, t:(l.vl?'vendor list '+fmtDate(l.vl):'in drawings '+fmtDate(l.dr))}));
  const portals=()=>onlineRegistered(y).map(r=>({n:r[RF.COMPANY]+' (online portal)', t:r[RF.DATE]?fmtDate(r[RF.DATE]):'no date'}));
  switch(key){
    case 'turnover': return [];   /* a country figure, no project records behind it */
    case 'vlA': return [...sbuOf('A'), ...sbuOf('Auth'), ...sbuOf('Dev'), ...portals()];
    case 'vlB': return sbuOf('B');
    case 'vlC': return sbuOf('C');
    case 'vlOther': return [...sbuOf('Auth'), ...sbuOf('Dev')];
    case 'focus': return live.filter(poReleased)
        .map(p=>({n:p[PF.PROJ]||'(no name)', t:[p[PF.SBU]||'', p[PF.INV]?'invoiced '+p[PF.INV].toLowerCase():'', (+p[PF.INVVAL]||0)?fmtSAR(+p[PF.INVVAL]):''].filter(Boolean).join(' · ')}));
    case 'fix': return fixContributors(y).map(c=>({n:c[CF.COMPANY]||c[CF.NAME], t:(+c[CF.NFIX]||0)+' install'+((+c[CF.NFIX]||0)>1?'s':'')+' · '+(c[CF.FIXDATE]?fmtDate(c[CF.FIXDATE]):'no date')}));
    case 'sem': return S.seminars.filter(s=>String(s[SF.DATE]).startsWith(y))
        .sort((a,b)=>(b[SF.DATE]||'')<(a[SF.DATE]||'')?-1:1)
        .map(s=>({n:s[SF.NAME], t:fmtDate(s[SF.DATE])+(s[SF.SBU]?' · '+s[SF.SBU]:'')+((+s[SF.PART]||0)?' · '+s[SF.PART]+' pax':'')}));
    case 'sbu': {
      const m={};
      S.seminars.filter(s=>String(s[SF.DATE]).startsWith(y) && String(s[SF.SBU]||'').trim())
        .forEach(s=>{ (m[s[SF.SBU]]=m[s[SF.SBU]]||[]).push(s[SF.NAME]); });
      return Object.keys(m).map(k2=>({n:k2, t:m[k2].length+' seminar'+(m[k2].length>1?'s':'')+': '+m[k2].slice(0,3).join(', ')+(m[k2].length>3?'…':'')}));
    }
    case 'addl': {
      const thr=+(kpiTargets().addl.thr)||0;
      return live.filter(p=>poReleased(p) && (+p[PF.EXP]||0)>=thr)
        .sort((a,b)=>(+b[PF.EXP]||0)-(+a[PF.EXP]||0))
        .map(p=>({n:p[PF.PROJ]||'(no name)', t:fmtSAR(+p[PF.EXP]||0)+(p[PF.CONS]?' · '+p[PF.CONS]:'')}));
    }
    default: return [];
  }
}

function kpiSet(key, field, v){
  if(kpiLocked()){ toast('Targets are locked. Press 🔒 Targets locked to unlock.', true); renderDash(); return; }
  kpiTargets()[key][field]=parseInt(String(v).replace(/[^\d]/g,''),10)||0;
  save('meta');
  logChange('Target changed: '+key+' '+field+' = '+v, 'Targets');
  renderDash();
}

function potentialSbus(){
  const out=[];
  S.vendors.forEach(v=>BU_KEYS.forEach(k=>{
    const b=v[VF.BUS] && v[VF.BUS][k];
    if(!b) return;
    if(sbuVL(b) || sbuDR(b)) return;                       /* already registered */
    const st=sbuStage(b);
    if(st==='Not Started' || !st) return;                  /* nothing happening yet */
    out.push({co:v[VF.COMPANY], sbu:BU_LABELS[k].replace('Hanger & Support','H&S'), stage:st,
              cls:classOf(v[VF.TYPE], v[VF.PRIO])});
  }));
  const rank={'In the Drawings':0,'Waiting for a Response':1,'In Progress':2,'Potential':3};
  return out.sort((a,b)=>(rank[a.stage]??9)-(rank[b.stage]??9) || a.co.localeCompare(b.co));
}

/* ---- duplicate detection & merge (by email, mobile, or name+company) ---- */
const _digits = s => String(s||'').replace(/\D/g,'');
function dupKeysOf(c){
  const ks=[];
  const em=String(c[CF.EMAIL]||'').trim().toLowerCase(); if(em) ks.push('e:'+em);
  const mo=_digits(c[CF.MOBILE]); if(mo.length>=9) ks.push('m:'+mo.slice(-9));
  const nm=String(c[CF.NAME]||'').trim().toLowerCase().replace(/\s+/g,' ');
  const co=String(c[CF.COMPANY]||'').trim().toLowerCase().replace(/\s+/g,' ');
  if(nm&&co) ks.push('n:'+nm+'|'+co);
  return ks;
}
function contactIdentity(c){
  const em=String(c[CF.EMAIL]||'').trim().toLowerCase();
  const mo=_digits(c[CF.MOBILE]).slice(-9);
  return _norm(c[CF.NAME])+'|'+_norm(c[CF.COMPANY])+'|'+em+'|'+mo;
}
function dupGroupKey(ids){
  return ids.map(id=>{ const c=S.contacts.find(x=>x[CF.ID]===id); return c?contactIdentity(c):'?'; })
            .sort().join('::');
}
function dupSkippedKeys(){ return (S.meta && S.meta.dupSkipped) || []; }
function findDupGroups(){
  const keyToGroup={}; const groups=[];
  S.contacts.forEach(c=>{
    const ks=dupKeysOf(c);
    let gi=-1;
    ks.forEach(k=>{ if(keyToGroup[k]!==undefined && gi===-1) gi=keyToGroup[k]; });
    if(gi===-1){ gi=groups.length; groups.push([]); }
    else {
      /* if this contact bridges two groups, merge them */
      ks.forEach(k=>{
        const other=keyToGroup[k];
        if(other!==undefined && other!==gi){
          groups[gi]=groups[gi].concat(groups[other]); groups[other]=[];
          Object.keys(keyToGroup).forEach(kk=>{ if(keyToGroup[kk]===other) keyToGroup[kk]=gi; });
        }
      });
    }
    groups[gi].push(c[CF.ID]);
    ks.forEach(k=>keyToGroup[k]=gi);
  });
  const skipped=dupSkippedKeys();
  return groups.filter(g=>g.length>1 && !skipped.includes(dupGroupKey(g)));
}
function mergeContactGroup(ids){
  const recs=ids.map(id=>S.contacts.find(c=>c[CF.ID]===id)).filter(Boolean).sort((a,b)=>a[CF.ID]-b[CF.ID]);
  if(recs.length<2) return null;
  const base=recs[recs.length-1];   /* newest record wins */
  recs.slice(0,-1).forEach(r=>{
    [CF.COMPANY,CF.DESIG,CF.NAME,CF.MOBILE,CF.EMAIL,CF.STATUS,CF.SEMDATE,CF.LEAD,CF.SEMSBU,CF.FOLLOWED].forEach(f=>{ if(!base[f]&&r[f]) base[f]=r[f]; });
    base[CF.NSEM]=Math.max(+base[CF.NSEM]||0, +r[CF.NSEM]||0);
    base[CF.NFIX]=Math.max(+base[CF.NFIX]||0, +r[CF.NFIX]||0);
    if(r[CF.NOTES] && !String(base[CF.NOTES]||'').includes(r[CF.NOTES])) base[CF.NOTES]=(base[CF.NOTES]?base[CF.NOTES]+' | ':'')+r[CF.NOTES];
    if(r[CF.YEAR]===curYear()) base[CF.YEAR]=curYear();
  });
  const drop=new Set(recs.slice(0,-1).map(r=>r[CF.ID]));
  S.contacts=S.contacts.filter(c=>!drop.has(c[CF.ID]));
  return base;
}
/* ---- one-by-one duplicate review wizard ---- */
let _dupQ=[], _dupI=0, _dupMerged=0, _dupSkipped=0;
function scanContactDups(){
  const groups=findDupGroups();
  if(!groups.length){
    const sk=dupSkippedKeys().length;
    if(sk){
      document.getElementById('m-title').textContent='No duplicates to review';
      document.getElementById('m-body').innerHTML='<div class="empty">Contacts are clean.<div class="mini-note" style="margin-top:9px">'+sk+' pair(s) you marked as different people are being left alone.</div></div>';
      document.getElementById('m-foot').innerHTML='<button class="btn" onclick="closeModal()">Close</button><button class="btn sm ghost" onclick="restoreDupSkips()">Review those '+sk+' again</button>';
      document.getElementById('modal-back').classList.add('open');
    } else toast('No duplicates found — contacts are clean.');
    return;
  }
  _dupQ=groups; _dupI=0; _dupMerged=0; _dupSkipped=0;
  showDupStep();
}
function dupMatchReason(recs){
  const ems=recs.map(c=>String(c[CF.EMAIL]||'').trim().toLowerCase()).filter(Boolean);
  if(ems.length>1 && new Set(ems).size<ems.length) return 'same email';
  const mos=recs.map(c=>_digits(c[CF.MOBILE]).slice(-9)).filter(m=>m.length>=9);
  if(mos.length>1 && new Set(mos).size<mos.length) return 'same mobile number';
  return 'same name + company';
}
function dupCardHTML(c, keep){
  return `<div style="border:1.5px solid ${keep?'var(--green)':'var(--line)'};border-radius:9px;padding:10px 12px;margin-bottom:8px;background:${keep?'#F2FBF5':'#fff'}">

      ${keep?'<span class="pill p-green">✓ will be kept</span>':'<span class="pill p-grey">merges into the kept one</span>'}
    </div>
    <div class="cell-sub" style="margin-top:4px" dir="auto">${esc(c[CF.COMPANY]||'')}${c[CF.MOBILE]?' · '+esc(c[CF.MOBILE]):''}${c[CF.EMAIL]?' · '+esc(c[CF.EMAIL]):''}</div>
    <div class="cell-sub" style="margin-top:2px">Seminars: ${+c[CF.NSEM]||0} · FiXperience: ${+c[CF.NFIX]||0}${c[CF.NOTES]?' · '+esc(String(c[CF.NOTES]).slice(0,70)):''}</div>
  </div>`;
}
function showDupStep(){
  while(_dupI<_dupQ.length){
    const g=_dupQ[_dupI];
    const recs=g.map(id=>S.contacts.find(c=>c[CF.ID]===id)).filter(Boolean).sort((a,b)=>a[CF.ID]-b[CF.ID]);
    if(recs.length<2){ _dupI++; continue; }
    const base=recs[recs.length-1];
    document.getElementById('m-title').textContent='Duplicates — group '+(_dupI+1)+' of '+_dupQ.length;
    document.getElementById('m-body').innerHTML=`
      <div class="mini-note" style="margin-bottom:10px">Matched by <b>${dupMatchReason(recs)}</b>. If merged: the newest record is kept, empty fields are filled from the older one, seminar/FiXperience counts keep the higher value, and notes are combined.</div>
      ${recs.map(c=>dupCardHTML(c, c[CF.ID]===base[CF.ID])).join('')}`;
    document.getElementById('m-foot').innerHTML=`
      <button class="btn ghost" onclick="finishDupReview()">Close</button>
      <button class="btn" onclick="dupSkip()">Skip — different people (never ask again)</button>
      <button class="btn navy" onclick="openDupChooser()">Choose what to keep…</button>
      <button class="btn navy" onclick="dupMergeAll()" title="Merge this group and every remaining group">Merge all remaining</button>
      <button class="btn primary" onclick="dupMergeCurrent()">Merge this group</button>`;
    document.getElementById('modal-back').classList.add('open');
    return;
  }
  finishDupReview();
}
const DUP_FIELDS=[[CF.COMPANY,'Company'],[CF.DESIG,'Designation'],[CF.NAME,'Full name'],[CF.MOBILE,'Mobile'],
  [CF.EMAIL,'Email'],[CF.STATUS,'Status'],[CF.SEMDATE,'Seminar date'],[CF.SEMSBU,'Seminar SBU'],

function dupPickAll(i){
  document.querySelectorAll('.dup-r').forEach(r=>{ r.checked = (+r.dataset.i===i); });

function applyDupChoice(){
  const g=_dupQ[_dupI];
  const recs=g.map(id=>S.contacts.find(c=>c[CF.ID]===id)).filter(Boolean).sort((a,b)=>a[CF.ID]-b[CF.ID]);
  const chosen={};
  document.querySelectorAll('.dup-r').forEach(r=>{ if(r.checked) chosen[+r.dataset.f]=+r.dataset.i; });
  const base=mergeContactGroup(g);          /* keeps the newest, fills blanks, joins notes */
  if(base){
    Object.entries(chosen).forEach(([f,i])=>{ const r=recs[i]; if(r) base[+f]=r[+f]; });
    if(String(base[CF.SEMSBU]||'').trim()) rememberSbu(sbuKeyCon(base[CF.COMPANY], base[CF.SEMDATE]), base[CF.SEMSBU]);
    _dupMerged++;
    logChange('Contacts merged with chosen fields: '+(base[CF.NAME]||base[CF.COMPANY]), 'Contacts');
  }
  _dupI++; save('contacts'); showDupStep();

function dupMergeCurrent(){ if(mergeContactGroup(_dupQ[_dupI])) _dupMerged++; _dupI++; save('contacts'); showDupStep(); }
function dupSkip(){
  const g=_dupQ[_dupI];
  if(g){
    const key=dupGroupKey(g);
    S.meta.dupSkipped=[...new Set([...(S.meta.dupSkipped||[]), key])];

    logChange('Marked as different people, will not be offered again: '+names.join(' / '), 'Contacts');
  }
  _dupSkipped++; _dupI++; showDupStep();
}
function restoreDupSkips(){
  S.meta.dupSkipped=[]; save('meta');

function dupMergeAll(){
  for(; _dupI<_dupQ.length; _dupI++){ if(mergeContactGroup(_dupQ[_dupI])) _dupMerged++; }

}

  while(k.length<10) k.push('');

function trackingContactGaps(){

/* a seminar date typed on a contact creates the Seminar-tab entry automatically.
   The new row is flagged so it shows in red until you confirm it. */
/* company names rarely match character for character between a contact card and a
   seminar row ("King Saud Medical City" vs "King Saudi Medical City (facade)"),
   so compare them on meaningful word stems instead. */
const NAME_STOP=new Set(['seminar','seminars','online','presentation','meeting','session','training','for','and','the','of','at','with','to']);
function nameTokens(s){
  /* initials matter: "A.O Architects" must not collapse to just "architects" */
  return String(s||'')
    .replace(/\([^)]*\)/g,' ')
    .toLowerCase()
    .replace(/[^a-z0-9\u0600-\u06FF ]+/g,' ')
    .split(/\s+/)
    .filter(w=>w && !NAME_STOP.has(w));
}
function tokenMatch(a,b){
  if(a===b) return true;
  const m=Math.min(a.length,b.length);
  return m>=4 && (a.startsWith(b)||b.startsWith(a));
}
function namesLikelySame(n1,n2){
  const A=nameTokens(n1), B=nameTokens(n2);
  if(!A.length || !B.length) return false;
  let hit=0;
  A.forEach(a=>{ if(B.some(b=>tokenMatch(a,b))) hit++; });
  const m=Math.min(A.length,B.length);
  if(m>=3 && hit<2) return false;         /* long names need more than one word in common */
  return hit/m >= 0.75;
}
/* the SBU chosen on a contact is mirrored onto its seminar row */
function applySbuToSeminar(s, sbu, nm){
  if(!sbu || s[SF.SBU]===sbu) return false;
  s[SF.SBU]=sbu;
  rememberSbu(sbuKeySem(s[SF.NAME], s[SF.DATE]), sbu);
  if(!s[SF.TOPIC] || /^fischer Products and Applications/.test(s[SF.TOPIC])) s[SF.TOPIC]=guessTopic(s[SF.NAME], sbu);
  if(s[SF.SRC]==='auto') s[SF.SRC]='';
  logChange('Seminar SBU copied from contact: '+(nm||s[SF.NAME])+' → '+sbu, 'Seminars');
  return true;
}
function pushContactSbuToSeminar(c){
  if(!c) return 0;
  const sbu=String(c[CF.SEMSBU]||'').trim();
  if(!sbu) return 0;
  const date=String(c[CF.SEMDATE]||'').slice(0,10);
  const nm=String(c[CF.COMPANY]||c[CF.NAME]||'').trim();
  if(!nm) return 0;
  let n=0;
  /* 1 - same name and same date */
  S.seminars.forEach(s=>{
    if(_norm(s[SF.NAME])===_norm(nm) && String(s[SF.DATE]).slice(0,10)===date && applySbuToSeminar(s,sbu,nm)) n++;
  });
  if(n){ save('seminars'); return n; }
  /* 2 - close-enough company name, same date */
  S.seminars.forEach(s=>{
    if(date && String(s[SF.DATE]).slice(0,10)===date && namesLikelySame(nm, s[SF.NAME]) && applySbuToSeminar(s,sbu,nm)) n++;
  });
  if(n){ save('seminars'); return n; }
  /* 3 - close-enough name and the seminar has no SBU yet; only when it is unambiguous */
  const cands=S.seminars.filter(s=>!s[SF.SBU] && namesLikelySame(nm, s[SF.NAME]));
  if(cands.length===1 && applySbuToSeminar(cands[0],sbu,nm)) n++;
  if(n) save('seminars');
  return n;
}

function openSbuFiller(){

function addSeminarFromContact(c, date, sbu){
  const name=(c[CF.COMPANY]||c[CF.NAME]||'').trim();
  if(!name) return;
  const dup=S.seminars.find(s=>_norm(s[SF.NAME])===_norm(name) && String(s[SF.DATE]).slice(0,10)===date);
  if(dup){
    if(sbu && !dup[SF.SBU]){ dup[SF.SBU]=sbu; save('seminars'); }
    toast('That seminar is already in the log');
    return;
  }
  unTombstoneSeminar(_norm(name));
  S.seminars.push([nextId(S.seminars), name, date, sbu || inferSemSBU(name), 'auto', guessTopic(name, sbu), randPax()]);
  save('seminars'); buildNav();
  logChange('Seminar auto-added from contact: '+name+' ('+fmtDate(date)+')', 'Seminars');
  toast('Seminar added to the Seminars tab — shown in red until you confirm it');

function isDateStr(s){
  const d=String(s||'').slice(0,10);
  return /^\d{4}-\d{2}-\d{2}$/.test(d) && !isNaN(new Date(d+'T00:00:00'));
}
function gapIgnored(){ return (S.meta && S.meta.gapIgnored) || []; }
function contactSeminarGaps(){
  const have=new Set(S.seminars.map(s=>_norm(s[SF.NAME])+'|'+String(s[SF.DATE]).slice(0,10)));
  const skip=new Set(gapIgnored());
  const ok=[], bad=[];
  S.contacts.forEach(c=>{
    if(skip.has(c[CF.ID])) return;
    const raw=String(c[CF.SEMDATE]||'').trim();
    if(!raw) return;
    const nm=String(c[CF.COMPANY]||c[CF.NAME]||'').trim();
    if(!nm) return;
    if(!isDateStr(raw)){ bad.push({c, nm, raw}); return; }
    const d=raw.slice(0,10);
    if(d < today()) return;                 /* only seminars still to come */
    if(have.has(_norm(nm)+'|'+d)) return;
    /* a close-enough seminar on the same date already covers it */
    if(S.seminars.some(s=>String(s[SF.DATE]).slice(0,10)===d && namesLikelySame(nm, s[SF.NAME]))) return;
    if(seminarTombstoned(nm)) return;
    ok.push({c, nm, d, sbu:c[CF.SEMSBU]||''});
  });
  ok.sort((a,b)=> a.d<b.d?1:-1);
  return {ok, bad};
}

function applySeminarGaps(){

function semContext(n){
  n=_norm(n);
  if(/substation|\bsec\b|babtain|electric|energy|power|tarshid/.test(n)) return 'Substations';
  if(/hospital|medical|habib|الحبيب|health|fakeeh|clinic/.test(n)) return 'Healthcare Facilities';
  if(/stadium/.test(n)) return 'Stadium Projects';
  if(/airport|aviation/.test(n)) return 'Airport Projects';
  if(/retail|mall|avenues/.test(n)) return 'Retail Projects';
  if(/hotel/.test(n)) return 'Hospitality Projects';
  if(/data\s*volt|datacent|data cent/.test(n)) return 'Data Centres';
  if(/tunnel|metro|rail/.test(n)) return 'Infrastructure Projects';
  if(/structur|structr/.test(n)) return 'Structural Applications';
  if(/arch\b|architect/.test(n)) return 'Architectural Applications';
  if(/contract|takamul|\brmc\b/.test(n)) return 'Site Execution';
  return '';
}
const SEM_TOPIC_BASE={
 'Firestop':'Firestopping Applications',
 'Facade':'Mechanical Fixing Systems for Ventilated Façades',
 'Anchoring':'Post-Installed Anchoring Design and Applications',
 'Hanger and Support':'MEP Hangers and Supports Systems',
 'Strengthening (Anchors+CFRP)':'Structural Strengthening with Anchors and CFRP',
 'Carbon Fiber':'Carbon Fibre Strengthening Solutions',
 'Software (FiXperience)':'FiXperience Design Software Training',
 'Multiple BUs':'fischer Fixing Solutions Overview'
};
function guessTopic(name, sbu){
  let s=sbu||inferSemSBU(name);
  const c=semContext(name);
  if(!s && (c==='Substations'||c==='Data Centres')) s='Firestop';
  if(!s && c==='Structural Applications') s='Anchoring';
  if(!s) return c ? 'fischer Products and Applications for '+c : 'fischer Products and Applications Overview';
  if(s==='Firestop') return 'Firestopping Applications for '+(c||'Buildings');
  const base=SEM_TOPIC_BASE[s]||'fischer Fixing Solutions Overview';
  if(s==='Facade') return base+(c&&c!=='Architectural Applications'?' for '+c:'');
  if(s==='Anchoring') return base+(c?' for '+c:'');
  if(s==='Strengthening (Anchors+CFRP)'||s==='Carbon Fiber') return base+(c&&c!=='Structural Applications'?' for '+c:'');
  return base;
}
function randPax(){ return 5+Math.floor(Math.random()*8); }
function setSemField(id, field, val, isNum){
  const s=S.seminars.find(x=>x[SF.ID]===id);
  if(!s) return;
  const v = isNum ? Math.max(0, parseInt(String(val).replace(/\D/g,''),10)||0) : String(val).trim();
  if(s[field]===v) return;
  const oldName = s[SF.NAME];
  s[field]=v;
  if(field===SF.NAME){
    const t=S.tasks.find(t=>t[TF.BUCKET]==='Seminar' && t[TF.STATUS]==='Completed' && _norm(t[TF.NAME])===_norm(oldName));
    if(t){ t[TF.NAME]=v; save('tasks'); }
  }
  logChange('Seminar "'+(s[SF.NAME]||'')+'" updated', 'Seminars');
  save('seminars'); keepScroll(renderSeminars);
}

function openSeminarForm(id){
  const s = id ? S.seminars.find(x=>x[SF.ID]===id) : null;
  openForm(s?'Edit seminar':'Log seminar', [
    {k:SF.NAME,label:'Seminar / company',type:'text',full:1},
    {k:SF.DATE,label:'Date delivered',type:'date'},
    {k:SF.SBU,label:'SBU',type:'select',opts:[''].concat(semSbuOpts())},
    {k:SF.TOPIC,label:'Topic of seminar',type:'text',full:1},
    {k:SF.PART,label:'Number of participants',type:'number'},
  ], s, vals=>{
    if(!String(vals[SF.SBU]||'').trim()) vals[SF.SBU]=inferSemSBU(vals[SF.NAME]);
    const oldName = s ? s[SF.NAME] : null;
    if(s){
      Object.entries(vals).forEach(([k,v])=>s[k]=v);
      const t=S.tasks.find(t=>t[TF.BUCKET]==='Seminar' && t[TF.STATUS]==='Completed' && _norm(t[TF.NAME])===_norm(oldName));
      if(t){ t[TF.NAME]=s[SF.NAME]; t[TF.DONE]=String(s[SF.DATE]).slice(0,10); save('tasks'); }
    }
    else {
      const r=[nextId(S.seminars),'',today(),'','','',randPax()]; Object.entries(vals).forEach(([k,v])=>r[k]=v);
      if(!r[SF.TOPIC]) r[SF.TOPIC]=guessTopic(r[SF.NAME], r[SF.SBU]);
      if(!+r[SF.PART]) r[SF.PART]=randPax();
      S.seminars.push(r);
      unTombstoneSeminar(_norm(r[SF.NAME]));
      if(!S.tasks.some(t=>t[TF.BUCKET]==='Seminar' && _norm(t[TF.NAME])===_norm(r[SF.NAME])))
        S.tasks.push([nextId(S.tasks), r[SF.NAME], 'Seminar', 'Completed', 'Medium', '', String(r[SF.DATE]).slice(0,10), '', '']);
      save('tasks');
    }
    if(String(vals[SF.SBU]||'').trim()) rememberSbu(sbuKeySem(vals[SF.NAME]||(s&&s[SF.NAME]), vals[SF.DATE]||(s&&s[SF.DATE])), vals[SF.SBU]);
    save('seminars'); refreshTab(); buildNav(); toast('Seminar saved');
  });
}

/* live comma formatting while typing in numeric cells (prevents accidental extra zeros) */
function fmtNumCell(el){
  const sel = window.getSelection ? window.getSelection() : null;
  let caretDigits = 0;
  if(sel && sel.rangeCount){
    const r = sel.getRangeAt(0);
    const pre = r.cloneRange(); pre.selectNodeContents(el); pre.setEnd(r.endContainer, r.endOffset);
    caretDigits = pre.toString().replace(/\D/g,'').length;
  }
  const digits = el.innerText.replace(/\D/g,'').slice(0,15);
  const formatted = digits ? Number(digits).toLocaleString('en-US') : '';
  if(el.innerText === formatted) return;
  el.innerText = formatted;
  if(sel && formatted){
    let count=0, pos=0;
    if(caretDigits>0){
      pos=formatted.length;
      for(let i=0;i<formatted.length;i++){
        if(/\d/.test(formatted[i])) count++;
        if(count>=caretDigits){ pos=i+1; break; }
      }
    }
    try{
      const range=document.createRange();
      range.setStart(el.firstChild, Math.min(pos, el.firstChild.length));
      range.collapse(true);
      sel.removeAllRanges(); sel.addRange(range);
    }catch(e){}
  }
}

  return `<a class="btn sm" style="text-decoration:none;${style||''}" href="${href}" target="_blank" title="${esc(title||'')}">${label}</a>`;
}
function _utf8b64(str){
  try{ return btoa(unescape(encodeURIComponent(str))); }catch(e){ return btoa(str.replace(/[^\x00-\x7F]/g,'?')); }
}
function _mimeHeader(s){
  return /^[\x00-\x7F]*$/.test(s) ? s : '=?UTF-8?B?'+_utf8b64(s)+'?=';
}
const OWA_HOSTS = {
  work:   {label:'Work / Microsoft 365 (outlook.office.com)', url:'https://outlook.office.com/mail/deeplink/compose'},
  work365:{label:'Work alternate (outlook.office365.com)',     url:'https://outlook.office365.com/mail/deeplink/compose'},
  live:   {label:'Personal (outlook.live.com)',                url:'https://outlook.live.com/mail/0/deeplink/compose'}
};
function owaHostKey(){ return (S.meta && S.meta.owaHost) || 'work'; }
function setOwaHost(k){ S.meta.owaHost=k; save('meta'); toast('Outlook Web account set to: '+OWA_HOSTS[k].label); }
function buildOwaCompose(to,subject,body){
  let b=body; if(b.length>1700) b=b.slice(0,1650)+'\n...';
  const base=(OWA_HOSTS[owaHostKey()]||OWA_HOSTS.work).url;
  return base+'?to='+encodeURIComponent(to)+'&subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(b);
}
async function openOutlookWeb(){
  const f=_emFields();
  const url=buildOwaCompose(f.to,f.subject,f.body);
  let w=null;
  try{ w=window.open(url,'_blank','noopener'); }catch(e){}
  if(w){ toast('Opening Outlook Web with the message ready.'); return; }
  await copyText(url,'Outlook Web link');
  toast('This window blocked the new tab. The Outlook Web link is copied: paste it in a browser tab.', true);
}
function buildMailto(to,subject,body){
  let b=body; if(b.length>1600) b=b.slice(0,1550)+'\n...';
  return 'mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(b);
}
function openEmailDraft(to, subject, body, title){
  document.getElementById('m-title').textContent = title || 'Email draft';
  document.getElementById('m-body').innerHTML=`
    <div class="f-grid">
      <div class="f-field full"><label>To</label><input id="em-to" value="${esc(to)}"></div>
      <div class="f-field full"><label>Subject</label><input id="em-sub" value="${esc(subject)}"></div>
      <div class="f-field full"><label>Message</label><textarea id="em-body" style="min-height:210px;font-family:inherit">${esc(body)}</textarea></div>

      <select onchange="setOwaHost(this.value)">

      </select></div>
    <div class="mini-note" style="margin-top:8px;line-height:1.6">

function _emFields(){
  return {
    to: (document.getElementById('em-to')||{}).value||'',
    subject: (document.getElementById('em-sub')||{}).value||'',
    body: (document.getElementById('em-body')||{}).value||''
  };
}
function tryOpenMailApp(){
  if(IS_EMBEDDED){ toast('Mail links are blocked in this preview window. Use “Download draft” instead.', true); return; }
  const f=_emFields();
  try{ location.href=buildMailto(f.to,f.subject,f.body); }
  catch(e){ toast('Your browser blocked the mail link. Use “Download draft”.', true); }
}
function downloadEmlDraft(){
  const f=_emFields();
  const eml=[
    'To: '+f.to,
    'Subject: '+_mimeHeader(f.subject),
    'X-Unsent: 1',
    'MIME-Version: 1.0',
    'Content-Type: text/plain; charset=utf-8',
    'Content-Transfer-Encoding: base64','',
    _utf8b64(f.body).replace(/(.{76})/g,'$1\n')
  ].join('\r\n');
  try{
    const blob=new Blob([eml],{type:'message/rfc822'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const safe=(f.subject||'draft').replace(/[^\w\d\-. ]+/g,'_').slice(0,60);
    a.href=url; a.download=safe+'.eml';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast('Draft downloaded. Double-click the .eml file and Outlook opens it ready to send.');
  }catch(e){ toast('Could not build the draft file: '+e.message, true); }
}
async function copyEmailDraft(){
  const f=_emFields();
  await copyText('To: '+f.to+'\nSubject: '+f.subject+'\n\n'+f.body, 'email draft');
}

function normIntlPhone(mobile){
  let raw=String(mobile||'').trim();
  if(!raw || raw==='-') return '';
  const hadPlus=raw.startsWith('+');
  let d=raw.replace(/\D/g,'');
  if(!d) return '';
  if(hadPlus) return d;                          /* already +country */
  if(d.startsWith('00')) return d.slice(2);      /* 00-prefixed intl */
  if(d.startsWith('966')||d.startsWith('971')||d.startsWith('20')||d.startsWith('973')||d.startsWith('965')||d.startsWith('968')||d.startsWith('974')||d.startsWith('962')) return d; /* has GCC/EG code */
  if(d.startsWith('0')) return '966'+d.slice(1); /* local Saudi 05x -> 9665x */
  if(d.length===9 && d.startsWith('5')) return '966'+d; /* 9-digit Saudi mobile */
  return d;
}
function waLink(mobile){ const d=normIntlPhone(mobile); return d?('https://wa.me/'+d):''; }
function telLink(mobile){ const d=normIntlPhone(mobile); return d?('tel:+'+d):''; }

  return bits.join(' · ');
}

function stampNow(){

  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes());

function downloadBackupFile(){
  try{
    const snap={hub:'fischer Spec Hub', v:3, build:(typeof HUB_BUILD!=='undefined'?HUB_BUILD:''), saved:new Date().toISOString(), counts:dataCounts(), data:{}};
    KEYS.forEach(k=>snap.data[k]=S[k]);
    const blob=new Blob([JSON.stringify(snap)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='fischer_Spec_Hub_backup_'+stampNow()+'.json';
    snap.build=HUB_BUILD;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    logChange('Backup file downloaded', 'Backup');
    toast('Backup saved. Keep this file: it restores everything into any copy of the hub.');
  }catch(e){ toast('Backup failed: '+e.message, true); }
}
function pickBackupFile(){
  let el=document.getElementById('bk-file');
  if(!el){
    el=document.createElement('input');
    el.type='file'; el.id='bk-file'; el.accept='.json,application/json';
    el.style.cssText='position:absolute;left:-9999px;width:1px;height:1px;opacity:0';
    document.body.appendChild(el);
  }
  el.onchange=function(){ const f=this.files && this.files[0]; this.value=''; if(f) restoreFromFile(f); };
  try{ el.click(); }

async function restoreFromFile(file){
  if(!file) return;
  try{
    const snap=JSON.parse(await file.text());
    if(!snap || !snap.data) throw new Error('not a hub backup file');
    const c=snap.counts||{};
    const ok=await appConfirm('Restore this backup?\n\nSaved: '+(snap.saved?fmtDateTime(new Date(snap.saved).getTime()):'unknown')+
      (snap.build?'\nSaved from build '+snap.build:'')+
      '\ncontacts '+(c.contacts??'?')+' · seminars '+(c.seminars??'?')+' ('+(c.sbuFilled??'?')+' with SBU)'+
      ' · tracking '+(c.tracking??'?')+' · projects '+(c.projects??'?')+' · vendors '+(c.vendors??'?')+' · tasks '+(c.tasks??'?')+
      '\n\nEverything currently in this copy is replaced.','Restore');
    if(!ok) return;
    await makeBackup('before file restore');
    KEYS.forEach(k=>{ if(snap.data[k]!==undefined) S[k]=snap.data[k]; });
    for(const k of KEYS) await sset(k);
    logChange('Restored from backup file', 'Backup');
    buildNav(); go('dash');
    toast('Restored. '+(S.contacts||[]).length+' contacts, '+(S.seminars||[]).length+' seminars.');
  }catch(e){ toast('Could not read that file: '+e.message, true); }
}

/* ================= RESTORE POINTS ================= */
const BK_KEY='spechub3:__backups';
async function readBackups(){
  try{ const r=await window.storage.get(BK_KEY); return r&&r.value?JSON.parse(r.value):[]; }catch(e){ return []; }
}
async function makeBackup(reason){
  if(!window.storage) return;
  try{
    const snap={t:Date.now(), reason:reason||'', counts:dataCounts(), data:{}};
    KEYS.forEach(k=>{ if(k!=='meta') snap.data[k]=S[k]; });
    let list=await readBackups();
    list.unshift(snap);
    list=list.slice(0,2);
    await window.storage.set(BK_KEY, JSON.stringify(list));
  }catch(e){ console.warn('backup skipped', e); }
}
function dataCounts(){
  return {contacts:(S.contacts||[]).length, seminars:(S.seminars||[]).length, tracking:(S.tracking||[]).length,
          projects:(S.projects||[]).length, vendors:(S.vendors||[]).length, tasks:(S.tasks||[]).length,
          onlinereg:(S.onlinereg||[]).length, regdocs:(S.regdocs||[]).length, team:(S.team||[]).length,
          sbuFilled:(S.seminars||[]).filter(s=>String(s[SF.SBU]||'').trim()).length};
}
async function openBackups(){
  const list=await readBackups();
  document.getElementById('m-title').textContent='Restore points';
  document.getElementById('m-body').innerHTML = list.length===0
    ? '<div class="empty">No restore point yet. One is taken automatically before any upgrade runs.</div>'
    : `<div class="mini-note" style="margin-bottom:10px">A snapshot is taken automatically before the hub upgrades your stored data. Restoring replaces everything currently in this browser with that snapshot.</div>
       ${list.map((b,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #EEF1F6">
         <div style="flex:1">
           <div style="font-weight:700;font-size:12.5px">${fmtDateTime(b.t)}${b.reason?' · '+esc(b.reason):''}</div>
           <div class="cell-sub">contacts ${b.counts.contacts} · seminars ${b.counts.seminars} (${b.counts.sbuFilled} with SBU) · tracking ${b.counts.tracking} · projects ${b.counts.projects} · vendors ${b.counts.vendors} · tasks ${b.counts.tasks}</div>
         </div>
         <button class="btn sm" onclick="restoreBackup(${i})">Restore</button>
       </div>`).join('')}`;
  document.getElementById('m-foot').innerHTML=`<button class="btn" onclick="closeModal()">Close</button>
    <button class="btn primary" onclick="makeBackup('manual').then(()=>{toast('Restore point saved');openBackups();})">Save a restore point now</button>`;
  document.getElementById('modal-back').classList.add('open');
}
async function restoreBackup(i){
  const list=await readBackups();
  const b=list[i];
  if(!b) return;
  if(!(await appConfirm('Restore the snapshot from '+fmtDateTime(b.t)+'?\n\nEverything currently in this browser is replaced by it.','Restore'))) return;
  await makeBackup('before restore');
  Object.keys(b.data).forEach(k=>{ S[k]=b.data[k]; });
  for(const k of KEYS) await sset(k);
  logChange('Restored the snapshot from '+fmtDateTime(b.t), 'Restore');
  closeModal(); buildNav(); go('dash');
  toast('Restored');
}

async function copyText(txt, label){
  try{ await navigator.clipboard.writeText(txt); toast('Copied: '+(label||txt).slice(0,40)); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); toast('Copied: '+(label||txt).slice(0,40)); }
    catch(e2){ toast('Copy failed — select the text manually', true); }
    ta.remove();
  }
}
function docExpiry(d){
  if(!d) return '';
  const days=Math.round((new Date(String(d).slice(0,10)+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);
  if(days<0) return `<span class="pill p-red">Expired ${fmtDate(d)}</span>`;
  if(days<=60) return `<span class="pill p-amber">Renew by ${fmtDate(d)}</span>`;
  return `<span class="pill p-green">Valid to ${fmtDate(d)}</span>`;
}

function renderTasks(){

  if(f.label) rows=rows.filter(t=>taskLabels(t).includes(f.label));
  if(f.hideDone) rows=rows.filter(t=>t[TF.STATUS]!=='Completed');
  const baseBuckets=SEED_DATA.options.buckets;
  const extra=[...new Set(S.tasks.map(t=>t[TF.BUCKET]).filter(b=>b && !baseBuckets.includes(b)))];
  let allBuckets=[...baseBuckets, ...extra];
  /* apply saved custom order */
  const ord=(S.meta&&S.meta.bucketOrder)||[];
  if(ord.length){ allBuckets.sort((a,b)=>{ const ia=ord.indexOf(a), ib=ord.indexOf(b); return (ia<0?999:ia)-(ib<0?999:ib); }); }
  if(S.meta&&S.meta.hideFollowupBucket) allBuckets=allBuckets.filter(b=>b!=='Follow-up Calls');
  /* when searching/filtering, show only buckets that actually contain a match (so results aren't buried among empty columns) */
  const filtering = !!f.q.trim() || !!f.label;
  if(filtering){
    allBuckets=allBuckets.filter(b=>{
      if(b==='Follow-up Calls') return false;   /* virtual bucket isn't part of task search */

  C.innerHTML=`
  <div class="filter-bar">
    <div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>

    <select onchange="FLT.tasks.sort=this.value;renderTasks()" title="Card order inside each bucket">
      <option value="date" ${f.sort==='date'?'selected':''}>Sort: by due date</option>
      <option value="manual" ${f.sort==='manual'?'selected':''}>Sort: my drag order</option></select>
    <button class="chip ${f.view==='list'?'on':''}" onclick="FLT.tasks.view=FLT.tasks.view==='list'?'board':'list';renderTasks()" title="Stack buckets vertically instead of side-by-side">List view</button>
    <button class="chip ${f.hideComments?'on':''}" onclick="FLT.tasks.hideComments=!FLT.tasks.hideComments;renderTasks()">Hide comments</button>
    <button class="chip ${(S.meta&&S.meta.hideFollowupBucket)?'on':''}" onclick="S.meta.hideFollowupBucket=!(S.meta&&S.meta.hideFollowupBucket);save('meta');renderTasks()">Hide follow-up bucket</button>
    <span class="count-note">drag to move or reorder · circle = advance status</span>
    <button class="btn sm" onclick="emailTaskSelection()" title="Email the tasks currently shown">✉ Email these tasks</button>
    <button class="btn sm" onclick="exportSheet('tasks')">Export sheet</button>

  </div>
  ${filtering && allBuckets.length===0 ? '<div class="empty" style="padding:30px">No tasks match “'+esc(f.q||f.label)+'”. (Completed tasks are hidden — turn off “Hide completed” to include them.)</div>' : ''}
  <div class="board ${f.view==='list'?'stacked':''}">
    ${allBuckets.map(b=>{
      /* tiers: 1 today · 2 upcoming(<90d) · 3 overdue · 4 weekly · 5 monthly · 6 every-3-months/yearly · 7 far-future(90d+) & undated */
      const tierOf = t => {
        const rep=t[TF.REPEAT], lb=t[TF.LABELS]||'';
        if(['Weekly','Every 2 weeks'].includes(rep) || /check\s*every\s*week/i.test(lb)) return 4;
        if(rep==='Monthly' || /check\s*every\s*month/i.test(lb)) return 5;

        const d=t[TF.DUE];
        if(!d) return 7;
        const days=daysUntil(d);
        if(days===0) return 1;
        if(days<0) return 3;
        if(days>=90) return 7;

      };
      if(b==='Follow-up Calls'){
        const fu=followupContacts();
        return `<div class="tcol" data-bucket="Follow-up Calls">

          ${fu.length===0?'<div class="empty" style="padding:12px;font-size:12px">All followed up ✓</div>':
          fu.slice(0,40).map(c=>`
          <div class="tcard">
            <div style="display:flex;gap:8px;align-items:flex-start">
              <button class="t-status-btn" onclick="markFollowed(${c[CF.ID]},true);renderTasks();updateFollowupCount()" title="Mark followed up"></button>

                <div class="t-meta"><span class="cell-sub">${esc(followupReason(c))}</span></div></div>
              ${c[CF.MOBILE]?extLinkBtn(waLink(c[CF.MOBILE]),'WA','WhatsApp '+(c[CF.NAME]||''),'padding:2px 7px;background:#25D366;color:#fff;border-color:#25D366',c[CF.MOBILE]):''}
            </div>
          </div>`).join('')}
          ${fu.length>40?`<div class="mini-note" style="padding:8px">+${fu.length-40} more — use the 📞 list</div>`:''}
        </div>`;
      }
      const list=rows.filter(t=>t[TF.BUCKET]===b)
        .sort((a,x)=>{
          const ad=a[TF.STATUS]==='Completed', xd=x[TF.STATUS]==='Completed';
          if(ad!==xd) return ad?1:-1;
          if(ad) return (x[TF.DONE]||'') < (a[TF.DONE]||'') ? -1:1;  /* completed: newest first */
          if(f.sort==='date'){
            const at=tierOf(a), xt=tierOf(x);
            if(at!==xt) return at-xt;
            const pr={'Urgent':0,'Important':1}; /* within a tier: urgent, important, then the rest */
            const ap=pr[a[TF.PRIO]]??2, xp=pr[x[TF.PRIO]]??2;
            if(ap!==xp) return ap-xp;
            if(at===3) return (x[TF.DUE]||'') < (a[TF.DUE]||'') ? -1:1;  /* overdue: most recent first */
            return (a[TF.DUE]||'9999') < (x[TF.DUE]||'9999') ? -1:1;     /* others: nearest date first */
          }
          return (a[TF.ORDER]??1e9)-(x[TF.ORDER]??1e9) || ((a[TF.DUE]||'9999') < (x[TF.DUE]||'9999') ? -1:1);
        });
      return `<div class="tcol" ondragover="bucketOrCardDragover(event, this)" ondragleave="this.classList.remove('dragover')" ondrop="dropTaskOrBucket(event, this, '${esc(b)}')" data-bucket="${esc(b)}">
        <h3 draggable="true" ondragstart="dragBucket(event,'${esc(b)}')" ondragend="clearBucketDrag()" title="Drag to reorder buckets">↕ ${esc(b)}<span class="bcnt">${list.length}</span>
          <button class="icon-btn" style="padding:1px 4px" onclick="openTaskForm(null,'${esc(b)}')" title="Add task to ${esc(b)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"/></svg></button></h3>
        ${list.map(t=>`
        <div class="tcard ${t[TF.STATUS]==='Completed'?'done':''}" draggable="true" ondragstart="dragTask(event,${t[TF.ID]})" ondragend="this.classList.remove('dragging');clearDropMarks()" ondragover="cardDragOver(event,this)" ondragleave="this.classList.remove('drop-above','drop-below')" ondrop="dropOnCard(event,${t[TF.ID]},this)">
          <div style="display:flex;gap:8px;align-items:flex-start">
            <button class="t-status-btn ${taskDotCls(t[TF.STATUS])}" onclick="cycleTask(${t[TF.ID]});keepScroll(renderTasks)" title="${t[TF.STATUS]} — click to advance">${t[TF.STATUS]==='Completed'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M5 12.5l4.5 4.5L19 8"/></svg>':''}</button>
            <div class="t-name" style="flex:1;cursor:pointer" dir="auto" onclick="openTaskForm(${t[TF.ID]})">${t[TF.NAME]?esc(t[TF.NAME]):'<i style="color:var(--muted)">(untitled task — click to name it)</i>'}</div>
          </div>
          <div class="t-meta">
            ${taskLabels(t).map(labelChip).join('')}
            ${t[TF.STATUS]==='In progress'?'<span class="pill p-blue">In progress</span>':''}
            ${t[TF.STATUS]==='Completed'&&t[TF.DONE]?`<span>✓ ${fmtDate(t[TF.DONE])}</span>`:(t[TF.DUE]?`<span class="${t[TF.DUE]<today()&&t[TF.STATUS]!=='Completed'?'due-late':''}">📅 ${fmtDate(t[TF.DUE])}${t[TF.TIME]?` ⏰ <span onclick="event.stopPropagation();clearTaskTime(${t[TF.ID]})" title="Remove this alarm" style="cursor:pointer;text-decoration:underline dotted">${esc(t[TF.TIME])} ✕</span>`:''}</span>`:'')}
            ${t[TF.PRIO]&&t[TF.PRIO]!=='Medium'?`<span class="pill ${t[TF.PRIO]==='Urgent'?'p-red':t[TF.PRIO]==='Important'?'p-orange':'p-grey'}">${esc(t[TF.PRIO])}</span>`:''}
            ${t[TF.REPEAT]?`<span class="pill p-navy" title="Repeats: ${esc(t[TF.REPEAT])}">🔁 ${esc(t[TF.REPEAT])}</span>`:''}
            ${f.hideComments && t[TF.COMMENTS] ? '💬' : ''}
          </div>
          ${!f.hideComments && t[TF.COMMENTS] ? (()=>{const ns=parseNotes(t[TF.COMMENTS]); const last=ns[ns.length-1];
              return `<div class="t-comm" dir="auto">${last&&last.d?`<b>${esc(last.d)}</b> · `:''}${esc(last?last.t:t[TF.COMMENTS])}${ns.length>1?`<span class="cell-sub"> · +${ns.length-1} earlier note${ns.length>2?'s':''}</span>`:''}</div>`;})() : ''}
        </div>`).join('') || '<div class="empty" style="padding:12px;font-size:12px">Drop tasks here</div>'}
      </div>`;}).join('')}
  </div>`;
}
function emailTaskSelection(){

    ...Object.keys(byBucket).map(b=>b.toUpperCase()+':\n'+byBucket[b].map(t=>

      +(t[TF.PRIO]&&t[TF.PRIO]!=='Medium'?'  ['+t[TF.PRIO]+']':'')
