function dragTask(ev, id){
  ev.dataTransfer.setData('text/plain', String(id));
  ev.dataTransfer.effectAllowed='move';
  ev.target.classList.add('dragging');
  clearDropMarks();
}
function bucketOrders(b){ return S.tasks.filter(x=>x[TF.BUCKET]===b && x[TF.STATUS]!=='Completed').map(x=>x[TF.ORDER]).filter(o=>o!==undefined && o!==''); }
function renormalizeBucket(b){
  S.tasks.filter(x=>x[TF.BUCKET]===b && x[TF.STATUS]!=='Completed')
    .sort((a,x)=>(a[TF.ORDER]??1e9)-(x[TF.ORDER]??1e9))
    .forEach((t,i)=>t[TF.ORDER]=(i+1)*10);
}
function applyBucketChange(t, bucket){
  const wasSeminar = t[TF.BUCKET]==='Seminar';
  t[TF.BUCKET]=bucket;
  if(wasSeminar && bucket!=='Seminar' && t[TF.STATUS]==='Completed') syncSeminarLog(t, true);
  else syncSeminarLog(t);
}
function dropTask(ev, col){
  ev.preventDefault();
  col.classList.remove('dragover');
  const id=+ev.dataTransfer.getData('text/plain');
  const t=S.tasks.find(x=>x[TF.ID]===id);
  if(!t) return;
  const bucket=col.dataset.bucket;
  if(t[TF.BUCKET]===bucket) return;
  applyBucketChange(t, bucket);
  const ords=bucketOrders(bucket);
  t[TF.ORDER]=(ords.length?Math.max(...ords):0)+10;   /* dropped on empty column area: bottom */
  save('tasks');
  keepScroll(renderTasks);
  toast('Moved to “'+bucket+'”');
}
let _draggingBucket=null;
function dragBucket(ev, bucket){
  _draggingBucket=bucket;
  ev.dataTransfer.setData('text/bucket', bucket);
  ev.dataTransfer.effectAllowed='move';
  ev.stopPropagation();
}
function clearBucketDrag(){ _draggingBucket=null; document.querySelectorAll('.tcol.bucket-target').forEach(c=>c.classList.remove('bucket-target')); clearDropMarks(); }
function bucketOrCardDragover(ev, col){
  ev.preventDefault();
  if(_draggingBucket){ col.classList.add('bucket-target'); }
  else col.classList.add('dragover');
}
function currentBucketOrder(){
  return [...document.querySelectorAll('.board .tcol')].map(c=>c.dataset.bucket);
}
function dropTaskOrBucket(ev, col, bucket){
  ev.preventDefault();
  col.classList.remove('dragover'); col.classList.remove('bucket-target');
  if(_draggingBucket){
    const from=_draggingBucket; _draggingBucket=null;
    if(from===bucket) return;
    const order=currentBucketOrder();
    const fi=order.indexOf(from), ti=order.indexOf(bucket);
    if(fi<0||ti<0) return;
    order.splice(fi,1);
    order.splice(order.indexOf(bucket) + (fi<ti?1:0), 0, from);
    S.meta.bucketOrder=order; save('meta');
    renderTasks();
    toast('Bucket order updated');
    return;
  }
  dropTask(ev, col);
}
/* while a card is dragged over another, show where it would land */
function cardDragOver(ev, el){
  ev.preventDefault(); ev.stopPropagation();
  if(_draggingBucket) return;
  const r=el.getBoundingClientRect();
  const below = (ev.clientY - r.top) > r.height/2;
  el.classList.toggle('drop-above', !below);
  el.classList.toggle('drop-below', below);
}
function clearDropMarks(){
  document.querySelectorAll('.tcard.drop-above,.tcard.drop-below')
    .forEach(c=>c.classList.remove('drop-above','drop-below'));
}
function dropOnCard(ev, targetId, el){
  ev.preventDefault(); ev.stopPropagation();
  const col=ev.currentTarget.closest ? ev.currentTarget.closest('.tcol') : null;
  if(col) col.classList.remove('dragover');
  document.querySelectorAll('.tcol.dragover').forEach(c=>c.classList.remove('dragover'));
  const below = !!(el && el.classList.contains('drop-below'));
  clearDropMarks();
  const id=+ev.dataTransfer.getData('text/plain');
  if(id===targetId) return;
  const t=S.tasks.find(x=>x[TF.ID]===id), tgt=S.tasks.find(x=>x[TF.ID]===targetId);
  if(!t||!tgt) return;
  const crossBucket = t[TF.BUCKET]!==tgt[TF.BUCKET];
  if(crossBucket) applyBucketChange(t, tgt[TF.BUCKET]);
  t[TF.ORDER]=(tgt[TF.ORDER]??0)+(below?5:-5);   /* drop on the lower half to go under */
  renormalizeBucket(tgt[TF.BUCKET]);
  save('tasks');
  keepScroll(renderTasks);
  if(crossBucket) toast('Moved to “'+tgt[TF.BUCKET]+'”');
}
function seminarLogHas(name){ return S.seminars.some(s=>String(s[SF.NAME]).trim().toLowerCase()===String(name).trim().toLowerCase()); }
function syncSeminarLog(t, removedFromBucket){
  /* keep Seminar bucket <-> Seminar log in sync */
  if(removedFromBucket || t[TF.BUCKET]!=='Seminar' || t[TF.STATUS]!=='Completed'){
    /* reopened, or moved out of Seminar bucket: remove its auto entry if present */
    if((removedFromBucket || t[TF.BUCKET]==='Seminar') ){
      const i=S.seminars.findIndex(s=>String(s[SF.NAME]).trim().toLowerCase()===String(t[TF.NAME]).trim().toLowerCase());

        S.seminars.splice(i,1); save('seminars'); buildNav();
        toast('Removed from Seminar log: '+t[TF.NAME].slice(0,40));
      }
    }
    return;
  }
  if(!seminarLogHas(t[TF.NAME])){
    unTombstoneSeminar(_norm(t[TF.NAME]));
    S.seminars.push([nextId(S.seminars), t[TF.NAME], t[TF.DONE]||today(), inferSemSBU(t[TF.NAME]), '', guessTopic(t[TF.NAME],''), randPax()]);
    save('seminars'); buildNav();

}
function advanceDate(d, rep){
  const base=new Date((String(d).slice(0,10)||today())+'T00:00:00');
  if(isNaN(base)) return advanceDate(today(), rep);
  const td=new Date(today()+'T00:00:00');
  const months={'Monthly':1,'Every 3 months':3,'Yearly':12}[rep];
  const days={'Daily':1,'Weekly':7,'Every 2 weeks':14}[rep];
  if(!months && !days) return '';
  let guard=0;
  do{
    if(days) base.setDate(base.getDate()+days);
    else{
      const day=base.getDate();
      base.setDate(1); base.setMonth(base.getMonth()+months);
      const last=new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
      base.setDate(Math.min(day,last));
    }
  } while(base<=td && ++guard<500);
  return base.toISOString().slice(0,10);
}
function spawnNextOccurrence(t){
  if(!t[TF.REPEAT]) return;
  const nd=advanceDate(t[TF.DUE], t[TF.REPEAT]);
  if(!nd) return;
  const _o=bucketOrders(t[TF.BUCKET]);
  S.tasks.push([nextId(S.tasks), t[TF.NAME], t[TF.BUCKET], 'Not started', t[TF.PRIO], nd, '', t[TF.COMMENTS]||'', t[TF.REPEAT], t[TF.LABELS]||'', (_o.length?Math.min(..._o):20)-10]);
  save('tasks');
  toast('🔁 Next occurrence created — due '+fmtDate(nd));
}
function removeSpawnedOccurrence(t){
  if(!t[TF.REPEAT]) return;
  const i=S.tasks.findIndex(x=> x[TF.ID]!==t[TF.ID] && x[TF.ID]>t[TF.ID] && x[TF.STATUS]==='Not started'
    && x[TF.NAME]===t[TF.NAME] && x[TF.BUCKET]===t[TF.BUCKET] && x[TF.REPEAT]===t[TF.REPEAT]);
  if(i>=0){ S.tasks.splice(i,1); save('tasks'); toast('Next occurrence removed'); }
}
function cycleTask(id){
  const t=S.tasks.find(x=>x[TF.ID]===id);
  const prev=t[TF.STATUS];
  const order=['Not started','In progress','Completed'];
  t[TF.STATUS]=order[(order.indexOf(t[TF.STATUS])+1)%3];
  t[TF.DONE]= t[TF.STATUS]==='Completed' ? today() : '';
  save('tasks'); buildNav();

}

function parseNotes(raw){
  const txt=String(raw||'').trim();
  if(!txt) return [];
  const out=[];
  txt.split('\n').forEach(line=>{
    const m=line.match(/^\s*\[([^\]]+)\]\s*([\s\S]*)$/);
    if(m) out.push({d:m[1].trim(), t:m[2].trim()});
    else if(out.length) out[out.length-1].t += (out[out.length-1].t?'\n':'')+line;   /* continuation */
    else out.push({d:'', t:line});
  });
  return out;
}

const _norm = s => String(s||'').trim().toLowerCase();
/* the option list is the standard list PLUS anything already saved, so a stored value
   can never become unselectable and can never be silently dropped */
/* ---- SBU lock ----------------------------------------------------------
   Every SBU you set is written to a permanent key/value store as well as onto
   the record. On load, any blank SBU is filled back in from this store, so an
   upgrade, a re-import or a rebuilt record can never lose what you typed. */
function sbuKeySem(name, date){ return 's|'+_norm(name)+'|'+String(date||'').slice(0,10); }
function sbuKeyCon(company, date){ return 'c|'+_norm(company)+'|'+String(date||'').slice(0,10); }
function rememberSbu(key, val){
  if(!key || !val) return;
  S.meta.sbuLock = S.meta.sbuLock || {};
  if(S.meta.sbuLock[key]===val) return;
  S.meta.sbuLock[key]=val;
  sset('meta');
}
function forgetSbu(key){
  if(S.meta.sbuLock && S.meta.sbuLock[key]){ delete S.meta.sbuLock[key]; sset('meta'); }
}
function reapplySbuLocks(){
  const lock=(S.meta && S.meta.sbuLock) || {};
  if(!Object.keys(lock).length) return 0;
  let n=0;
  S.seminars.forEach(s=>{
    if(String(s[SF.SBU]||'').trim()) return;
    const v=lock[sbuKeySem(s[SF.NAME], s[SF.DATE])];
    if(v){ s[SF.SBU]=v;
      if(!s[SF.TOPIC] || /^fischer Products and Applications/.test(s[SF.TOPIC])) s[SF.TOPIC]=guessTopic(s[SF.NAME], v);
      n++; }
  });
  S.contacts.forEach(c=>{
    if(String(c[CF.SEMSBU]||'').trim()) return;
    const v=lock[sbuKeyCon(c[CF.COMPANY], c[CF.SEMDATE])];
    if(v){ c[CF.SEMSBU]=v; n++; }
  });
  if(n){ save('seminars'); save('contacts'); logChange(n+' SBU value(s) restored from the saved lock', 'Protected'); }
  return n;
}
function semSbuOpts(){
  const base=SEED_DATA.options.seminarSBU;
  const used=[...new Set([
    ...S.seminars.map(s=>String(s[SF.SBU]||'').trim()),
    ...S.contacts.map(c=>String(c[CF.SEMSBU]||'').trim())
  ])].filter(Boolean);
  return [...base, ...used.filter(u=>!base.includes(u))];
}
function inferSemSBU(name){
  const n=_norm(name); const hits=new Set();
  if(/firestop|fire stop/.test(n)) hits.add('Firestop');
  if(/facade|façade|fcade|cladding/.test(n)) hits.add('Facade');
  if(/carbon\s*fib|cfrp/.test(n)) hits.add('Carbon Fiber');
  if(/retrofit|strengthen|strenghten|تقوية/.test(n)) hits.add('Strengthening (Anchors+CFRP)');
  if(/anchor|fixing/.test(n)) hits.add('Anchoring');
  if(/software|fixperience/.test(n)) hits.add('Software (FiXperience)');
  if(/\bmep\b|hanger|support/.test(n)) hits.add('Hanger and Support');
  /* carbon fiber is a strengthening topic — one wins, not "multiple" */
  if(hits.has('Carbon Fiber') && hits.has('Strengthening (Anchors+CFRP)')) hits.delete('Strengthening (Anchors+CFRP)');
  if(hits.size===1) return [...hits][0];
  if(hits.size>1) return 'Multiple BUs';
  return '';
}

async function delRow(key, id, rerender){
  if(!(await appConfirm('Delete this record? This cannot be undone.','Delete'))) return;
  /* keep Seminar log and Seminar-bucket board cards mirrored — remove ALL matches + tombstone so it never comes back */
  if(key==='tasks'){
    const t=S.tasks.find(x=>x[TF.ID]===id);
    if(t && t[TF.BUCKET]==='Seminar' && t[TF.STATUS]==='Completed'){
      const n=_norm(t[TF.NAME]);

      S.tasks=S.tasks.filter(x=>x[TF.ID]===id || !(x[TF.BUCKET]==='Seminar' && x[TF.STATUS]==='Completed' && _norm(x[TF.NAME])===n));
      tombstoneSeminar(n);
      save('seminars');
    }
  }
  if(key==='seminars'){
    const s=S.seminars.find(x=>x[SF.ID]===id);
    if(s){
      const n=_norm(s[SF.NAME]);
      S.seminars=S.seminars.filter(x=>x[SF.ID]===id || _norm(x[SF.NAME])!==n);   /* twins go too */
      S.tasks=S.tasks.filter(t=>!(t[TF.BUCKET]==='Seminar' && t[TF.STATUS]==='Completed' && _norm(t[TF.NAME])===n));
      tombstoneSeminar(n);
      save('tasks');
    }
  }
  const gone=S[key].find(r=>r[0]===id);
  logChange('Deleted from '+key+': '+((gone&&(gone[1]||gone[2]))||('#'+id)), 'Deleted');
  S[key]=S[key].filter(r=>r[0]!==id);
  save(key); rerender(); buildNav(); toast('Deleted');
}

/* ================= POWERPOINT EXPORT ================= */
const PPT_NAVY='1E2F4D', PPT_RED='E2001A', PPT_LINE='D8DEE8', PPT_ALT='F3F6FA';
function pptHeader(pptx, slide, title){
  slide.addShape('rect',{x:0,y:0,w:13.333,h:0.92,fill:{color:PPT_NAVY}});
  slide.addShape('rect',{x:0,y:0.92,w:13.333,h:0.06,fill:{color:PPT_RED}});
  slide.addText(title.toUpperCase(),{x:0.4,y:0.08,w:10.6,h:0.76,color:'FFFFFF',bold:true,fontSize:19,fontFace:'Arial',valign:'middle'});
  const _lh=0.26, _lw=_lh*LOGO_AR;
  slide.addImage({data:FISCHER_LOGO,x:13.333-0.45-_lw,y:(0.92-_lh)/2,w:_lw,h:_lh});
  const dt = S.slides.meetingDate?fmtDate(S.slides.meetingDate):fmtDate(today());
  slide.addText(dt+'    |    fischer Saudi Arabia — Specifications',{x:0.4,y:7.12,w:12.5,h:0.3,fontSize:9,color:'8A94A8',fontFace:'Arial'});
}
function thRow(cells){ return cells.map(t=>({text:t,options:{fill:{color:PPT_NAVY},color:'FFFFFF',bold:true,align:'center',valign:'middle',fontSize:10}})); }
function tdRow(cells, alt, opts){ return cells.map((t,i)=>({text:String(t??''),options:Object.assign({fill:{color:alt?PPT_ALT:'FFFFFF'},color:'1A2233',fontSize:9.5,align:'center',valign:'middle'},(opts&&opts[i])||{})})); }

async function buildPPT(){
  if(typeof PptxGenJS==='undefined'){ toast('PowerPoint library did not load — check your internet connection and reload.', true); return; }
  const btn=document.getElementById('ppt-btn'); if(btn){btn.disabled=true; btn.textContent='Building…';}
  try{
    const pptx=new PptxGenJS();
    pptx.defineLayout({name:'W16x9',width:13.333,height:7.5});
    pptx.layout='W16x9';
    pptx.author='Mohamed Bakr'; pptx.company='fischer Saudi Arabia';
    pptx.title='Specifications Review Meeting — Mohamed Bakr';
    const now=new Date(), tillTxt=now.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
    const barType = pptx.ChartType ? pptx.ChartType.bar : 'bar';

    /* 1 — title */
    let s=pptx.addSlide();
    s.background={color:PPT_NAVY};
    s.addImage({data:FISCHER_LOGO,x:0.8,y:1.1,w:0.5*LOGO_AR,h:0.5});
    s.addText('Specifications Review Meeting',{x:0.8,y:2.5,w:11.5,h:1,fontSize:38,bold:true,color:'FFFFFF',fontFace:'Arial'});
    s.addText('Mohamed Bakr',{x:0.8,y:3.5,w:11.5,h:0.8,fontSize:30,bold:true,color:PPT_RED,fontFace:'Arial'});
    s.addShape('rect',{x:0.85,y:4.5,w:1.7,h:0.09,fill:{color:PPT_RED}});
    s.addText('Monthly Technical Meeting — '+(S.slides.meetingDate?fmtDate(S.slides.meetingDate):tillTxt),{x:0.8,y:4.8,w:11,h:0.5,fontSize:16,color:'B9C5D8',fontFace:'Arial'});

    /* 2 — KPI */
    s=pptx.addSlide(); pptHeader(pptx,s,'Overall Review — Target vs. Achievement');
    const kpiRows=[thRow(['Group','KPI','Target (Yearly)','Achievement'])];
    KPI_ROWS.forEach((r,i)=>{
      const grp = i===0?'Vendor list':(i<5?'':' ');
      kpiRows.push(tdRow([grp, r[0], S.slides.targets[r[1]]||'-', kpiAchieved(r[1],r[2])], i%2,
        {1:{align:'left'},3:{bold:true,color:PPT_NAVY}}));
    });
    s.addTable(kpiRows,{x:1.6,y:1.35,w:10.1,colW:[1.7,4.6,1.9,1.9],border:{pt:0.5,color:PPT_LINE},rowH:0.52,fontFace:'Arial'});

    /* 3 — approvals matrix */
    const mx=matrixRows();
    s=pptx.addSlide(); pptHeader(pptx,s,'Overall Review — Vendor Approvals '+mx.year);
    const mrows=[thRow(['Company','Type','Prio','Total','Anchor','H&S','Firestop','Façade','Retrofit'])];
    mx.rows.forEach((r,i)=>mrows.push(tdRow([r.name,r.type,r.prio,r.tot,...r.hits.map(h=>h?'✓':'')],i%2,
      {0:{align:'left'},3:{bold:true},4:{color:'2E9E5B',bold:true},5:{color:'2E9E5B',bold:true},6:{color:'2E9E5B',bold:true},7:{color:'2E9E5B',bold:true},8:{color:'2E9E5B',bold:true}})));
    mrows.push(['TOTAL','','',String(mx.grand),...mx.totals.map(String)].map((t,i)=>({text:t,options:{fill:{color:PPT_NAVY},color:'FFFFFF',bold:true,align:i===0?'left':'center',fontSize:10}})));
    s.addTable(mrows,{x:0.45,y:1.3,w:12.45,colW:[3.5,1.35,0.8,0.95,1.17,1.17,1.17,1.17,1.17],border:{pt:0.5,color:PPT_LINE},rowH:Math.min(0.42, 5.4/(mrows.length)),fontFace:'Arial',fontSize:9});

    /* 4 — SBU chart */

    s.addChart(barType,[{name:'Approvals',labels:BU_KEYS.map(k=>BU_LABELS[k]),values:BU_KEYS.map(k=>bu[k])}],

function impNorm(v){
  if(v instanceof Date){
    const off = new Date(v.getTime() - v.getTimezoneOffset()*60000);
    return off.toISOString().slice(0,10);
  }
  return String(v??'').trim();
}
function impNum(v){ const n=parseInt(String(v??'').replace(/[^\d.-]/g,''),10); return isNaN(n)?0:n; }
function sheetRows(ws){
  return XLSX.utils.sheet_to_json(ws,{header:1, defval:''}).map(r=>r.map(impNorm));
}
function colIdx(hdr, ...names){
  const low=hdr.map(h=>String(h).toLowerCase().trim());
  for(const n of names){ const i=low.indexOf(n.toLowerCase()); if(i>=0) return i; }
  for(const n of names){ const i=low.findIndex(h=>h.includes(n.toLowerCase())); if(i>=0) return i; }
  return -1;
}
function normTrackBU(b){
  const m={'facade':'Façade','façade':'Façade','f':'Façade','fixing':'Fixings','fixings':'Fixings','firestop':'Firestop','mep':'MEP','anchor':'Anchoring','rettro':'Retrofitting','cast in chanel':'Cast-in Channels','cast in':'Cast-in Channels','rigistration':'Registration','registration':'Registration'};
  return m[String(b).toLowerCase().trim()] || String(b).trim();
}
function statusToNum(v){
  v=String(v).trim();
  if(/^[0-4]$/.test(v)) return v;
  const i=TRACK_STATUS.findIndex(s=>s.toLowerCase()===v.toLowerCase());
  return i>=0?String(i):'0';
}

    const out=[];
    const lb=colIdx(h,'labels');

    return out;
  }},
  'Consolidated Data': {key:'tasks', label:'Weekly Plan (MS Planner export)', parse(rows){
    const h=rows[0];
    const ci={id:colIdx(h,'task id'),na:colIdx(h,'task name'),bu:colIdx(h,'bucket name','bucket'),st:colIdx(h,'progress','status'),pr:colIdx(h,'priority'),du:colIdx(h,'due date'),do2:colIdx(h,'completed date'),cm:colIdx(h,'description')};
    const out=[]; const semAdd=[];
    rows.slice(1).forEach(r=>{
      if(!r[ci.na]) return;
      const bucket=(r[ci.bu]||'').trim(), status=r[ci.st]||'Not started';
      if(bucket==='Seminar' && status==='Completed'){ semAdd.push([0, r[ci.na], r[ci.do2]||r[ci.du]||'']); return; }
      const recCol=colIdx(h,'is recurring'), lbCol=colIdx(h,'labels');
      const rep = recCol>=0 && ['true','yes','1'].includes(String(r[recCol]).toLowerCase()) ? 'Weekly' : '';
      out.push([out.length+1, r[ci.na], bucket, status, r[ci.pr]||'Medium', r[ci.du]||'', r[ci.do2]||'', r[ci.cm]||'', rep, lbCol>=0?(r[lbCol]||''):'']);
    });
    if(semAdd.length){
      /* merge new seminars into log (skip duplicates by name+date) */
      const seen=new Set(S.seminars.map(s=>s[SF.NAME]+'|'+String(s[SF.DATE]).slice(0,10)));
      let added=0;
      semAdd.forEach(x=>{ const k2=x[1]+'|'+String(x[2]).slice(0,10); if(!seen.has(k2)){ S.seminars.push([nextId(S.seminars), x[1], x[2], inferSemSBU(x[1]), '', guessTopic(x[1],''), randPax()]); seen.add(k2); added++; } });
      if(added){ save('seminars'); toast(added+' completed seminars merged into the Seminar log'); }
    }
    return out;
  }},
};

async function importExcelFile(file){
  if(!file) return;
  if(typeof XLSX==='undefined'){ toast('Excel library did not load — check connection and reload.', true); return; }
  try{
    const wb = XLSX.read(await file.arrayBuffer(), {cellDates:true});
    const found = wb.SheetNames.filter(n=>IMPORTERS[n]);
    if(!found.length){ toast('No recognized sheets. Expected hub-export sheets, "Tracking" (team file), or "Consolidated Data" (Planner export).', true); return; }
    const labels = found.map(n=>'• '+IMPORTERS[n].label);
    if(!(await appConfirm('Found in "'+file.name+'":\n\n'+labels.join('\n')+'\n\nThis will REPLACE the matching data in the hub (seminar-log merges are additive). Continue?','Import'))) return;
    let done=[];
    for(const n of found){
      const imp=IMPORTERS[n];
      const data=imp.parse(sheetRows(wb.Sheets[n]));
      if(data && data.length){ S[imp.key]=data; save(imp.key); done.push(imp.label+' ('+data.length+')'); }
    }
    ensureTaskOrders();
    buildNav(); go(currentTab);
    toast('Imported: '+done.join(', '));
  }catch(e){ console.error(e); toast('Import failed: '+e.message, true); }
}

const REMIND_EMAIL = 'mohamed.bakr@fischer.ae';
function daysUntil(due){
  const d = new Date(String(due).slice(0,10)+'T00:00:00');
  const t = new Date(today()+'T00:00:00');
  return Math.round((d-t)/86400000);
}
/* four blocks, in this order: today · missed by 1-2 days · missed earlier · upcoming */
function dueSoonTasks(){
  const g={today:[], late12:[], lateOld:[], upcoming:[]};
  S.tasks.forEach(t=>{
    if(t[TF.STATUS]==='Completed' || !t[TF.DUE]) return;
    const n=daysUntil(t[TF.DUE]);
    if(n===0) g.today.push(t);
    else if(n<0 && n>=-2) g.late12.push(t);
    else if(n<-2) g.lateOld.push(t);
    else if(n>=1 && n<=2) g.upcoming.push(t);
  });
  g.today.sort((a,b)=>(a[TF.PRIO]==='Urgent'?-1:0)-(b[TF.PRIO]==='Urgent'?-1:0));
  g.late12.sort((a,b)=>(b[TF.DUE]||'')<(a[TF.DUE]||'')?-1:1);   /* yesterday before the day before */
  g.lateOld.sort((a,b)=>(b[TF.DUE]||'')<(a[TF.DUE]||'')?-1:1);
  g.upcoming.sort((a,b)=>(a[TF.DUE]||'')<(b[TF.DUE]||'')?-1:1);
  return g;
}

function cleanTracking(list){
  /* drop 'Template Only' rows and collapse template-absorbed duplicate BU rows (same BU repeated) */
  let changed=false;
  const out=list.filter(k=>{
    if(String(k[KF.CONS]).trim().toLowerCase()==='template only'){ changed=true; return false; }
    return true;
  });
  out.forEach(k=>{
    if(k[KF.BUS].length>8){
      const seen=new Set(); const bus=[];
      k[KF.BUS].forEach(b=>{ if(seen.has(b[0])) return; seen.add(b[0]); bus.push(b); });
      if(bus.length<k[KF.BUS].length){ k[KF.BUS]=bus; changed=true; }
    }
  });
  return {list:out, changed};
}
function ensureTaskOrders(){
  if(S.tasks.some(t=>t[TF.ORDER]!==undefined && t[TF.ORDER]!=='' && t[TF.ORDER]!==null)) return;

  });
  save('tasks');
}

  {

  {

    S.seminars=S.seminars.filter(s=>{

  {

const SYNC_CFG_KEY = 'spechub3_sync_cfg';   // token + gist id live in localStorage, NOT in the synced data
const SYNC_FILE = 'fischer_spec_hub_data.json';

/* iOS clears a home-screen app's storage after a few days of not opening it, which
   takes the token and Gist ID with it. The config is therefore kept in three places:
   localStorage, this file's own storage, and a long-life cookie. If any one survives,
   the connection comes back by itself. The shortcut URL is the final fallback. */
let _cfgCache=null;
function cookieGet(k){
  try{ const m=document.cookie.match(new RegExp('(^| )'+k+'=([^;]+)')); return m?decodeURIComponent(m[2]):null; }catch(e){ return null; }
}
function cookieSet(k,v){
  try{ document.cookie=k+'='+encodeURIComponent(v)+'; path=/; max-age=31536000; SameSite=Lax'; }catch(e){}
}
function syncCfg(){
  if(_cfgCache) return _cfgCache;
  let c=null;
  try{ c=JSON.parse(localStorage.getItem(SYNC_CFG_KEY)); }catch(e){}
  if(!c || !c.token){ try{ const v=cookieGet('spechub_sync'); if(v) c=JSON.parse(v); }catch(e){} }
  if(!c || !c.token){ try{ const v=window.__syncCfgBackup; if(v) c=v; }catch(e){} }
  _cfgCache = c || {};
  return _cfgCache;
}
function saveSyncCfg(c){
  _cfgCache=c||{};
  const s=JSON.stringify(_cfgCache);
  try{ localStorage.setItem(SYNC_CFG_KEY, s); }catch(e){}
  cookieSet('spechub_sync', s);
  window.__syncCfgBackup=_cfgCache;
  if(window.storage){ try{ window.storage.set('spechub3:__sync', s); }catch(e){} }
}
async function recoverSyncCfg(){
  if(syncCfg().token) return false;
  if(window.storage){
    try{
      const r=await window.storage.get('spechub3:__sync');
      if(r && r.value){ const c=JSON.parse(r.value); if(c && c.token){ saveSyncCfg(c); return true; } }
    }catch(e){}
  }
  return false;
}

function ghHeaders(token){
  return { 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' };
}

async function gistGet(token, gist){
  const r=await fetch('https://api.github.com/gists/'+gist, {headers:ghHeaders(token)});
  if(!r.ok) throw new Error('read failed ('+r.status+')');
  const j=await r.json();
  const f=j.files && j.files[SYNC_FILE];
  if(!f) return null;
  if(f.truncated && f.raw_url){ const rr=await fetch(f.raw_url); return JSON.parse(await rr.text()); }
  return JSON.parse(f.content);
}
async function gistPut(token, gist, data){
  const body=JSON.stringify({ files:{ [SYNC_FILE]:{ content:JSON.stringify(data) } } });
  const url = gist ? 'https://api.github.com/gists/'+gist : 'https://api.github.com/gists';
  const method = gist ? 'PATCH' : 'POST';
  const r=await fetch(url, {method, headers:ghHeaders(token), body: gist ? body : JSON.stringify({description:'fischer Spec Hub data', public:false, files:{ [SYNC_FILE]:{ content:JSON.stringify(data) } }})});
  if(!r.ok) throw new Error('write failed ('+r.status+')');
  return await r.json();
}

      document.getElementById('m-body').innerHTML=`
        <div class="mini-note" style="margin-bottom:11px;line-height:1.7">Work was done here <b>and</b> on your other device since ${fmtDateTime(since)}. Sync replaces everything rather than merging, so one side has to win. A restore point was saved first, so nothing is lost for good.</div>
        <table class="tbl"><thead><tr><th>Version</th><th>Last edited</th><th>Contacts</th><th>Seminars</th></tr></thead><tbody>
          <tr><td><b>This device</b></td><td>${fmtDateTime(lEdit)}</td><td>${lc}</td><td>${ls}</td></tr>
          <tr><td><b>The cloud copy</b></td><td>${fmtDateTime(rEdit)}</td><td>${rc}</td><td>${rs}</td></tr>
        </tbody></table>
        <div class="mini-note" style="margin-top:9px">Pick the one with the work you care about. If unsure, keep this device, press <b>⬇ Backup</b>, then sync again and take the cloud copy: you can compare the two files afterwards.</div>`;
      document.getElementById('m-foot').innerHTML=`
        <button class="btn" onclick="closeModal()">Decide later</button>
        <button class="btn navy" onclick="closeModal();resolveSync('remote')">Take the cloud copy</button>
        <button class="btn primary" onclick="closeModal();resolveSync('local')">Keep this device</button>`;
      document.getElementById('modal-back').classList.add('open');
      _pendingRemote=remote;
      return;
    }
    if(rEdit>lEdit){
      await applySnapshot(remote);
      c.lastSync=Date.now(); saveSyncCfg(c);
      buildNav(); go(currentTab);
      toast('Pulled newer data from your other device ✓');
    } else if(lEdit>rEdit){
      await gistPut(c.token, c.gist, local);
      c.lastSync=Date.now(); saveSyncCfg(c);
      toast('Pushed your changes to the cloud ✓');
    } else {
      c.lastSync=Date.now(); saveSyncCfg(c);
      toast('Already up to date ✓');
    }
    const dot=document.getElementById('sync-dot'); if(dot) dot.style.display='none';
  }catch(e){
    console.error(e);
    let msg=String(e.message||e);
    if(/failed to fetch|networkerror|load failed/i.test(msg)){
      msg='this window cannot reach GitHub. Open the hub from your GitHub Pages link or the downloaded file, then sync there.';
      (()=>{
        document.getElementById('m-title').textContent='Sync cannot run in this window';
        document.getElementById('m-body').innerHTML=`
          <div class="mini-note" style="line-height:1.7">The preview window inside Claude is sandboxed and blocks outgoing connections, so it cannot reach github.com. Nothing is wrong with your token.
          <br><br><b>Do this instead:</b><br>
          1 · Open your hosted link, for example <code>https://YOURNAME.github.io/spec-hub</code>, or double-click the downloaded HTML file.<br>
          2 · Press <b>Sync</b> there, paste the same token, leave the Gist ID empty the first time.<br>
          3 · It will create the Gist and show you its ID. Use that ID on your phone.</div>`;
        document.getElementById('m-foot').innerHTML='<button class="btn primary" onclick="closeModal()">Understood</button>';
        document.getElementById('modal-back').classList.add('open');
      })();
    }
    else if(msg.includes('401')) msg='token rejected. Check it has the “gist” scope and was copied in full.';
    else if(msg.includes('403')) msg='GitHub refused the request. If the token is new, wait a minute and try again.';
    else if(msg.includes('read failed')) msg='cannot read that Gist. Check the Gist ID.';
    toast('Sync failed: '+msg, true);
  }
  _syncing=false;
  if(btn) btn.style.opacity='1';
}

function disconnectSync(){
  localStorage.removeItem(SYNC_CFG_KEY);
  closeModal();
  const dot=document.getElementById('sync-dot'); if(dot) dot.style.display='none';
  toast('Disconnected from sync. Data on this device is untouched.');
}
function fmtDateTime(ts){ try{ const d=new Date(ts); return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
/* ================= WHATSAPP WEEKLY STATUS GENERATOR ================= */
/* Honest scope: WhatsApp has NO API to auto-post Status, and automating WhatsApp
   Web risks a permanent ban. So this does the tedious part — pick a random project
   image + brand it — and hands you a ready image. You tap Post in WhatsApp yourself. */

let _waImages = [];          // {name, dataUrl}
let _waPicked = null;

function openWAStatus(){
  document.getElementById('m-title').textContent='WhatsApp weekly status — image maker';
  const sbuList = [...new Set(S.projects
    .filter(p=>p[PF.STATUS]!=='Canceled' && p[PF.SBU])
    .map(p=>String(p[PF.SBU]).trim()))].sort();
  document.getElementById('m-body').innerHTML=`
    <div class="mini-note" style="margin-bottom:12px;line-height:1.65">
      Pick project photos once (they stay in this browser). Each week tap <b>Shuffle</b> to get a random project, then <b>Download</b> the branded image and post it as your WhatsApp status. WhatsApp can't be posted to automatically — this makes the image in one tap; posting is the only manual step.
    </div>
    <div class="f-field full">
      <label>1 · Your project photos folder</label>
      <input type="file" id="wa-files" accept="image/*" multiple onchange="waLoadImages(this.files)">
      <div id="wa-count" class="mini-note" style="margin-top:5px">${_waImages.length?_waImages.length+' photo(s) loaded this session':'No photos loaded yet — select several at once'}</div>
    </div>
    <div class="f-field full">
      <label>2 · Caption text (business unit / SBU)</label>
      <select id="wa-cap" onchange="waRefreshPreview()">
        <option value="">— random SBU each shuffle —</option>
        ${sbuList.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}
        <option value="__custom">✎ Custom text…</option>
      </select>
      <input id="wa-cap-custom" placeholder="Type your own caption" style="display:none;margin-top:7px" oninput="waRefreshPreview()">
    </div>
    <div style="text-align:center;margin:8px 0">
      <canvas id="wa-canvas" width="600" height="1067" style="width:210px;height:373px;border-radius:12px;box-shadow:var(--shadow);background:#0d1b2a"></canvas>
    </div>
    <div style="text-align:center;color:var(--muted);font-size:11.5px" id="wa-picked-name"></div>`;
  document.getElementById('m-foot').innerHTML=`
    <button class="btn" onclick="closeModal()">Close</button>
    <button class="btn" onclick="waShuffle()" ${_waImages.length?'':'disabled'} id="wa-shuffle">🎲 Shuffle project</button>
    <button class="btn primary" onclick="waDownload()" ${_waImages.length?'':'disabled'} id="wa-dl">⬇ Download image</button>`;
  document.getElementById('modal-back').classList.add('open');
  document.getElementById('wa-cap').addEventListener('change',e=>{
    document.getElementById('wa-cap-custom').style.display = e.target.value==='__custom'?'block':'none';
  });
  if(_waImages.length && !_waPicked) waShuffle();
  else if(_waPicked) waRefreshPreview();
}

function waLoadImages(files){
  const arr=[...files];
  let done=0;
  if(!arr.length) return;
  _waImages=[];
  arr.forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{
      _waImages.push({name:f.name, dataUrl:r.result});
      done++;
      if(done===arr.length){
        document.getElementById('wa-count').textContent=_waImages.length+' photo(s) loaded this session';
        document.getElementById('wa-shuffle').disabled=false;
        document.getElementById('wa-dl').disabled=false;
        waShuffle();
      }
    };
    r.readAsDataURL(f);
  });
}

function waCaptionText(){
  const sel=document.getElementById('wa-cap');
  if(!sel) return '';
  if(sel.value==='__custom') return (document.getElementById('wa-cap-custom').value||'').trim();
  if(sel.value) return sel.value;
  // random: pick a distinct SBU from active projects
  const pool=[...new Set(S.projects.filter(p=>p[PF.STATUS]!=='Canceled' && p[PF.SBU]).map(p=>String(p[PF.SBU]).trim()))];
  if(!pool.length) return 'fischer engineered fixing solutions';
  return pool[Math.floor(Math.random()*pool.length)];
}
let _waCaptionCache='';

function waShuffle(){
  if(!_waImages.length){ toast('Load some project photos first', true); return; }
  _waPicked=_waImages[Math.floor(Math.random()*_waImages.length)];
  _waCaptionCache=waCaptionText();   // lock one random caption per shuffle
  waRefreshPreview();
}
function waRefreshPreview(){
  if(!_waPicked) return;
  drawWAStatus(document.getElementById('wa-canvas'), _waPicked.dataUrl, _waCaptionCache||waCaptionText());
  const nm=document.getElementById('wa-picked-name'); if(nm) nm.textContent='Photo: '+_waPicked.name;
}

function drawWAStatus(canvas, imgUrl, caption){
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.fillStyle='#0d1b2a'; ctx.fillRect(0,0,W,H);
  const img=new Image();
  img.onload=()=>{
    // cover-fit the photo into the 9:16 frame
    const ar=img.width/img.height, car=W/H;
    let dw,dh,dx,dy;
    if(ar>car){ dh=H; dw=H*ar; dx=(W-dw)/2; dy=0; }
    else { dw=W; dh=W/ar; dx=0; dy=(H-dh)/2; }
    ctx.drawImage(img,dx,dy,dw,dh);
    // top gradient for logo, bottom gradient for caption
    let g=ctx.createLinearGradient(0,0,0,220); g.addColorStop(0,'rgba(13,27,42,.85)'); g.addColorStop(1,'rgba(13,27,42,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,220);
    g=ctx.createLinearGradient(0,H-380,0,H); g.addColorStop(0,'rgba(13,27,42,0)'); g.addColorStop(1,'rgba(13,27,42,.92)');
    ctx.fillStyle=g; ctx.fillRect(0,H-380,W,380);
    // fischer red accent bar
    ctx.fillStyle='#E2001A'; ctx.fillRect(0,H-150,W,7);
    // logo top-left
    const logo=new Image();
    logo.onload=()=>{
      const lw=250, lh=lw/LOGO_AR;
      ctx.drawImage(logo,44,44,lw,lh);
      drawWACaption(ctx,W,H,caption);
    };
    logo.onerror=()=>drawWACaption(ctx,W,H,caption);
    logo.src=FISCHER_LOGO;   // white wordmark for dark bg
  };
  img.onerror=()=>{ ctx.fillStyle='#fff'; ctx.font='24px sans-serif'; ctx.fillText('Image failed to load',40,H/2); };
  img.src=imgUrl;
}
function drawWACaption(ctx,W,H,caption){
  ctx.textAlign='left';
  ctx.fillStyle='#8Fb0c8'; ctx.font='600 26px system-ui,Arial'; 
  ctx.fillText('BUSINESS UNIT', 44, H-210);
  // wrap caption
  ctx.fillStyle='#fff'; ctx.font='700 46px system-ui,Arial';
  const words=(caption||'').split(/\s+/); let line='', y=H-160; const maxW=W-88, lines=[];
  words.forEach(w=>{ const t=line?line+' '+w:w; if(ctx.measureText(t).width>maxW && line){ lines.push(line); line=w; } else line=t; });
  if(line) lines.push(line);
  lines.slice(0,3).forEach((ln,i)=>ctx.fillText(ln, 44, y+i*54));
  ctx.fillStyle='#cfe0ec'; ctx.font='500 24px system-ui,Arial';
  ctx.fillText('fischer Saudi Arabia · specification', 44, H-56);
}

async function waDownload(){
  if(!_waPicked){ toast('Shuffle a project first', true); return; }
  const canvas=document.getElementById('wa-canvas');
  try{
    canvas.toBlob(blob=>{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download='fischer_status_'+stampNow()+'.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      toast('Image downloaded — open WhatsApp and post it as your Status');
    },'image/png');
  }catch(e){ toast('Download failed: '+e.message, true); }
}
